<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Admin{% endblock %} · EZ-PZ</title>
  <style>
    :root {
      --bg: #101317; --surface-1: #16191f; --surface-2: #1a1e25; --surface-3: #21262f;
      --hairline: rgba(255,255,255,.08); --hairline-strong: rgba(255,255,255,.16);
      --text: #e7eaee; --muted: #97a0ab; --accent: #5aa7d4; --accent-h: #7cbde0;
      --success: #47a37e; --danger: #d66b64; --warning: #d5a03f;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px; line-height: 1.5;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-h); }
    .topbar {
      display: flex; align-items: center; gap: 16px;
      padding: 12px 20px; border-bottom: 1px solid var(--hairline);
      background: var(--surface-1); position: sticky; top: 0; z-index: 10;
    }
    .brand { font-weight: 800; letter-spacing: .14em; font-size: 13px; }
    .brand span { color: var(--accent); }
    .spacer { flex: 1; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 20px 60px; }
    input, select, button, textarea { font: inherit; }
    .input {
      height: 38px; padding: 0 11px; border: 1px solid var(--hairline-strong);
      border-radius: 7px; background: #0d1014; color: var(--text); outline: none;
    }
    .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(90,167,212,.14); }
    .btn {
      height: 38px; padding: 0 14px; border-radius: 7px; border: 1px solid var(--hairline-strong);
      background: var(--surface-3); color: var(--text); cursor: pointer; font-weight: 650;
      display: inline-flex; align-items: center; gap: 7px; transition: border-color .12s, background .12s;
    }
    .btn:hover { border-color: var(--accent); }
    .btn-primary { background: #3d84b3; border-color: transparent; color: #f4f8fb; }
    .btn-primary:hover { background: #4d95c4; }
    .btn-danger { color: #e39a95; border-color: rgba(214,107,100,.4); background: transparent; }
    .btn-danger:hover { border-color: var(--danger); background: rgba(214,107,100,.08); }
    .btn-sm { height: 30px; padding: 0 10px; font-size: 12px; }
    .card {
      border: 1px solid var(--hairline); border-radius: 10px; background: var(--surface-2);
      padding: 18px; margin-bottom: 16px;
    }
    .card h2 { margin: 0 0 14px; font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--hairline); }
    th { color: var(--muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; }
    tr:hover td { background: rgba(255,255,255,.02); }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700;
      border: 1px solid var(--hairline-strong); color: var(--muted);
    }
    .badge-admin { color: #a9d3ec; border-color: rgba(90,167,212,.5); background: rgba(90,167,212,.1); }
    .badge-super { color: #d8c58a; border-color: rgba(213,160,63,.5); background: rgba(213,160,63,.1); }
    .badge-ok { color: #8fcfae; border-color: rgba(71,163,126,.5); background: rgba(71,163,126,.1); }
    .badge-off { color: #e39a95; border-color: rgba(214,107,100,.5); background: rgba(214,107,100,.1); }
    .muted { color: var(--muted); }
    .mono { font-family: var(--mono); }
    .flash { padding: 10px 13px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; }
    .flash-ok { border: 1px solid rgba(71,163,126,.4); background: rgba(71,163,126,.08); color: #a2d9be; }
    .flash-error { border: 1px solid rgba(214,107,100,.4); background: rgba(214,107,100,.08); color: #e4aaa5; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .grid2 { display: grid; grid-template-columns: 160px 1fr; gap: 8px 16px; align-items: center; }
    .feature-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 4px 0 14px; }
    .feature-item { display: flex; gap: 9px; align-items: flex-start; padding: 9px 11px; border: 1px solid var(--hairline); border-radius: 8px; background: var(--surface-1); }
    .feature-item small { display: block; color: var(--muted); font-size: 11px; }
    .danger-zone { border-color: rgba(214,107,100,.35); }
    @media (max-width: 620px) { .feature-list { grid-template-columns: 1fr; } .grid2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">EZ-PZ <span>ADMIN</span></div>
    <div class="spacer"></div>
    {% block topbar %}{% endblock %}
  </div>
  <div class="wrap">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ 'error' if category == 'error' else 'ok' }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
