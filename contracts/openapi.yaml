            application/json:
              schema: { $ref: "#/components/schemas/InviteReply" }
        "400":
          $ref: "#/components/responses/PackError"
        "403":
          $ref: "#/components/responses/PackError"
        "404":
          $ref: "#/components/responses/PackError"
        "409":
          $ref: "#/components/responses/PackError"
        "429":
          $ref: "#/components/responses/PackError"

  /api/packs/{uuid}/invites/{invite_id}:
