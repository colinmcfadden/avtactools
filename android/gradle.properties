org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Disable auto-detecting broken or legacy JDK installations in default OS locations
org.gradle.java.installations.auto-detect=false
# Which JDK runs Gradle is each machine's own choice (JAVA_HOME, or org.gradle.java.home in
# %USERPROFILE%\.gradle\gradle.properties): a path here breaks every other machine and CI.


# The Android app's own version (versionName), apart from the product's (frontend/package.json): 0.x until it
# is in the store, then 1.0.0. Bumped by hand at each store release; versionCode is the CI run number.
ezpz.versionName=0.1.0
# The API majors this build can talk to (contracts/openapi.yaml's info.version). A server that serves none of
# them gets "Update required", or a wait for the server if it is the older one. contracts/scripts/api_version.py
# check fails while none of these is served. Comma-separated.
ezpz.apiMajors=1
