            application/json:
              schema: { $ref: "#/components/schemas/PackMemberReply" }
        "400":
          $ref: "#/components/responses/PackError"
        "403":
          $ref: "#/components/responses/PackError"
        "404":
          $ref: "#/components/responses/PackError"
        "409":
          $ref: "#/components/responses/PackError"
    delete:
      operationId: removePackMember
      summary: Remove a member (owner), or leave (yourself). The owner hands the pack over first
      security:
        - bearer: []
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "403":
          $ref: "#/components/responses/PackError"
        "404":
          $ref: "#/components/responses/PackError"
        "409":
          $ref: "#/components/responses/PackError"

  /api/packs/{uuid}/invites:
    parameters:
      - $ref: "#/components/parameters/PackUuid"
    get:
      operationId: listPackInvites
      summary: Invitations not yet answered (owner); an expired one says `expired`
      security:
        - bearer: []
      responses:
        "200":
          description: Invitations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteList" }
        "403":
          $ref: "#/components/responses/PackError"
        "404":
