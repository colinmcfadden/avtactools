      responses:
        "200":
          description: Joined.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteAccepted" }
        "404":
          $ref: "#/components/responses/PackError"
        "410":
          $ref: "#/components/responses/PackError"

components:
  parameters:
    SessionHeader:
      name: X-EZPZ-Session
      in: header
      required: false
      description: |
        `cookie`: the web asks for (on sign-in) or uses (on refresh) a session whose
        refresh token is an HttpOnly, Secure, SameSite=None, Partitioned cookie under
        `/api/auth`. A custom header, so a page on another site cannot send it without a
        CORS preflight, which only `CORS_ORIGINS` pass. Ignored for a native app.
      schema:
        type: string
        enum: [cookie]
    ClientHeader:
      name: X-EZPZ-Client
      in: header
      required: false
      description: |
        Which app is calling: `platform/version (build)`, e.g. `android/1.4.0 (212)`.
        Sent by the native apps on every request. Recorded against sign-ins so the
        owner can see which versions are in the field. Anything that does not match
        this shape is ignored, never stored.
      schema:
        type: string
        maxLength: 64
        pattern: '^(android|ios|web)/\d{1,4}\.\d{1,4}\.\d{1,4}(-[0-9A-Za-z.]{1,20})?( \(\d{1,9}\))?$'

    LidarKey:
      name: key
      in: path
      required: true
      description: A tileset's or a build's opaque key, as `resolve` and `build` give it; anything else is 400.
      schema:
        type: string
        pattern: '^[0-9a-f]{16}$'

    LidarWatcher:
      name: watcher
      in: query
      required: false
      description: The waiter's opaque id, as sent with the build (`^[A-Za-z0-9_-]{8,64}$`; anything else is dropped).
      schema:
        type: string

    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        The record's `revision` that this edit was based on, e.g. `"3"` (`*` matches
        any). A stale one is refused with 409 and nothing is overwritten.
      schema:
        type: string
        pattern: '^(\*|(W/)?"?\d{1,9}"?)$'

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        A key the device makes up for one write and repeats when it retries it. Printable
        ASCII, 64 characters at most; anything else is ignored. The write is applied once.
      schema:
        type: string
        maxLength: 64

    PackUuid:
      name: uuid
      in: path
      required: true
      description: The pack's `uuid`.
      schema: { type: string, maxLength: 36 }

    PackItemUuid:
      name: item
      in: path
      required: true
      description: The item's `uuid` within the pack.
      schema: { type: string, maxLength: 64 }

    UserId:
      name: user_id
      in: path
      required: true
      schema: { type: integer }

    TeamId:
      name: id
      in: path
      required: true
      schema: { type: integer }

    InviteId:
      name: invite_id
      in: path
      required: true
      schema: { type: integer }

  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The `access_token` from sign-in or refresh.

  headers:
    ETag:
      description: The record's current `revision`, quoted.
      schema: { type: string, example: '"3"' }

  responses:
    SimpleError:
      description: |
        An error from the saved-record and sync routes, which predate the auth routes'
        shape and keep theirs so the web app is undisturbed: `error` is for people, `code`
        (when present) is stable and meant for the app.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SimpleError"

    Error:
      description: An error. `code` is stable and meant for the app; `message` is for people.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    FieldError:
      description: |
        A failure of `/api/analyze-field`: `message` is for people. There is no `code`; an app tells
        "no area here" (400) from "the map data or the model failed" (500) by the status.
      content:
        application/json:
          schema:
            type: object
            required: [status, message]
            properties:
              status: { type: string, enum: [error] }
              message: { type: string }

    Conflict:
      description: |
        The record changed on the server since the revision the edit was based on.
        Nothing was overwritten; `server` is the current copy.
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
      content:
        application/json:
          schema:
            type: object
            required: [error, code, server]
            properties:
              error: { type: string }
              code: { type: string, enum: [revision_conflict] }
              server:
                $ref: "#/components/schemas/LzFull"

    RouteConflict:
      description: |
        The route set changed on the server since the revision the edit was based on.
        Nothing was overwritten; `server` is the current copy.
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
      content:
        application/json:
          schema:
            type: object
            required: [error, code, server]
            properties:
              error: { type: string }
              code: { type: string, enum: [revision_conflict] }
              server:
                $ref: "#/components/schemas/RouteFull"

    PointSetConflict:
      description: |
        The point set changed on the server since the revision the edit was based on.
        Nothing was overwritten; `server` is the current copy.
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
      content:
        application/json:
          schema:
            type: object
            required: [error, code, server]
            properties:
              error: { type: string }
              code: { type: string, enum: [revision_conflict] }
              server:
                $ref: "#/components/schemas/PointSetFull"

    BriefConflict:
      description: |
        The brief changed on the server since the revision the edit was based on.
        Nothing was overwritten; `server` is the current copy.
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
      content:
        application/json:
          schema:
            type: object
            required: [error, code, server]
            properties:
              error: { type: string }
              code: { type: string, enum: [revision_conflict] }
              server:
                $ref: "#/components/schemas/BriefFull"

    AircraftConflict:
      description: |
        The profile changed on the server since the revision the edit was based on.
        Nothing was overwritten; `server` is the current copy.
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
      content:
        application/json:
          schema:
            type: object
            required: [error, code, server]
            properties:
              error: { type: string }
              code: { type: string, enum: [revision_conflict] }
              server:
                $ref: "#/components/schemas/AircraftProfile"

    AircraftError:
      description: Refused. `errors` lists every problem found; `error` is the first.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
              errors: { type: array, items: { type: string } }
              code: { type: string, enum: [invalid_client_uuid, invalid_if_match] }

    PackError:
      description: An error from the pack and team routes. `code` is stable and meant for the app.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PackError"

  schemas:
    LidarTarget:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number }
        lon: { type: number }
        radius_m: { type: number, minimum: 50, maximum: 2000 }
        stream: { type: boolean, description: "This client frames on `frame`: answer a streamed survey where nothing is built." }

    LidarResolve:
      type: object
      required: [key, available, url, contextUrl]
      properties:
        key: { type: string, pattern: '^[0-9a-f]{16}$' }
        available: { type: boolean }
        url: { type: string, nullable: true, description: "The tileset's root, relative to the API's root; null when it is not built." }
        contextUrl: { type: string, nullable: true, description: "The thinned ring round it, relative to the API's root; null when none was built." }
        canBuild: { type: boolean, description: "Not built only: whether this server can build it." }
        target:
          description: "Not built only: the caller's own place, echoed."
          type: object
          required: [lat, lon, radius_m]
          properties:
            lat: { type: number }
            lon: { type: number }
            radius_m: { type: number }
        streamed: { type: boolean, description: "Asked for with `stream` only: the tileset is a whole survey, streamed." }
        frame:
          description: "Streamed only: where to open the view. The caller's own place, echoed, with the ground's WGS84 ellipsoidal height in metres (null where nothing says it)."
          type: object
          required: [lat, lon, radius_m, height_m]
          properties:
            lat: { type: number }
            lon: { type: number }
            radius_m: { type: number }
            height_m: { type: number, nullable: true }

    LidarBuild:
      type: object
      description: |
        A build as the service reports it, or a place already built (`state: done` with the tileset's
        place, and no `stage`). `state` is `queued`, `running`, `done`, `failed` or `cancelled` (dropped
        because nobody waited); `stage` a word for what it is doing (`waiting`, `starting`, `locating
        survey`, `processing points`, `building tiles`, `building context`, `done`, `cancelled`; a new
        one may come, so show what is not known as it is); `position` how many builds are ahead of a
        queued one; `elapsed_s` how long a started one has run; `error` why one failed.
      required: [key, state]
      properties:
        key: { type: string, pattern: '^[0-9a-f]{16}$' }
        state: { type: string }
        stage: { type: string, nullable: true }
        error: { type: string, nullable: true }
        position: { type: integer, nullable: true }
        elapsed_s: { type: integer, nullable: true }
        available: { type: boolean }
        url: { type: string, nullable: true }
        contextUrl: { type: string, nullable: true }

    Tileset:
      type: object
      description: |
        The parts of a 3D Tiles 1.0 tileset.json the apps read (the format is the Open Geospatial
        Consortium's; this is py3dtiles's use of it). Anything else in it is passed over.
      required: [asset, geometricError, root]
      properties:
        asset:
          type: object
          required: [version]
          properties:
            version: { type: string }
        geometricError: { type: number }
        root:
          $ref: "#/components/schemas/Tile"

    Tile:
      type: object
      description: |
        `transform` is a column-major 4 × 4 matrix from this tile's frame to its parent's (the root's to
        WGS84 geocentric metres). `refine` is `ADD` (drawn with its children) or `REPLACE` (drawn until
        they are); a tile without one refines as its parent does. A `content.uri` ending in `.json` is
        a tileset of its own.
      required: [boundingVolume, geometricError]
      properties:
        boundingVolume:
          type: object
          properties:
            box: { type: array, items: { type: number }, description: "Centre, then the three half-axes, in the tile's frame." }
            sphere: { type: array, items: { type: number } }
            region: { type: array, items: { type: number } }
        geometricError: { type: number }
        refine: { type: string, enum: [ADD, REPLACE] }
        transform: { type: array, items: { type: number } }
        content:
          type: object
          required: [uri]
          properties:
            uri: { type: string }
        children:
          type: array
          items:
            $ref: "#/components/schemas/Tile"

    PointWind:
      type: object
      required: [dirTrue, speedKts, variable, station, source, distanceMiles]
      properties:
        dirTrue: { type: integer, description: Whole degrees true the wind blows from; 0 when variable. }
        speedKts: { type: number }
        variable: { type: boolean }
        tempC: { type: number, nullable: true, description: The nearest observation's temperature. }
        station: { type: string, nullable: true }
        source: { type: string, enum: [METAR, TAF] }
        distanceMiles: { type: number }

    SimpleError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code:
          type: string
          description: "`invalid_client_uuid`, `invalid_if_match`, `invalid_cursor`, `revision_conflict`; for briefs `missing_fields`, `invalid_name`, `invalid_data`; for the weather `invalid_at`"

    Error:
      type: object
      required: [status, message, error]
      properties:
        status: { type: string, enum: [error] }
        message: { type: string }
        error: { type: string }
        code:
          type: string
          description: |
            Stable codes include `invalid_credentials`, `invalid_refresh_token`,
            `refresh_reuse_detected`, `refresh_cookie_missing` (the web asked for a cookie
            session and sent no cookie), `refresh_expired` (no longer sent: an older
            server's 180-day limit), `account_unavailable`,
            `reauthentication_required`, `confirmation_required`, `session_not_found`,
            `super_admin_protected`, `rate_limited`, `affiliation_required`, `invalid_token`
            (an emailed link that is invalid, spent or expired), `invalid_code` (a `.mil` code).

    User:
      type: object
      required: [id, email, name, role, is_admin, is_active, features, access_ok]
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        picture: { type: string, nullable: true }
        email_verified: { type: boolean }
        account_status: { type: string }
        has_password: { type: boolean }
        role: { type: string }
        is_admin: { type: boolean }
        is_active: { type: boolean }
        features:
          type: object
          description: Entitlements. A missing key means enabled.
          additionalProperties: { type: boolean }
        mil_email: { type: string, nullable: true }
        affiliation_verified: { type: boolean }
        access_ok: { type: boolean, description: Whether the `.mil` / approval gate is cleared. }

    Done:
      type: object
      required: [status, message]
      properties:
        status: { type: string, enum: [success] }
        message: { type: string }

    Accepted:
      type: object
      required: [status, message]
      properties:
        status: { type: string, enum: [success] }
        message: { type: string }
        requires_verification: { type: boolean, description: Present on registration. }

    TokenResponse:
      type: object
      required: [status, access_token, user]
      properties:
        status: { type: string, enum: [success] }
        access_token: { type: string }
        refresh_token:
          type: string
          description: Native clients only. Spent on use; the response to `/refresh` carries the next one.
        refresh_expires_in:
          type: integer
          description: Seconds a refresh token lives (30 days); each refresh extends it, with no other limit.
        expires_in:
          type: integer
          description: Web cookie sessions only. Seconds the access token lives (a day from a sign-in, 15 minutes from a refresh).
        session:
          type: string
          description: "Web cookie sessions only: `cookie`, the refresh token was set as the `ezpz_refresh` cookie."
        user:
          $ref: "#/components/schemas/User"

    Session:
      type: object
      additionalProperties: false
      required: [id, client, created_at, last_active_at, current]
      properties:
        id: { type: string }
        client: { type: string, nullable: true, description: "The app, e.g. `android/1.4.0 (212)`." }
        created_at: { type: string }
        last_active_at: { type: string }
        current: { type: boolean, description: This device. }

    LzSummary:
      type: object
      required: [id, name, created_at, updated_at, client_uuid, revision]
      properties:
        id: { type: integer }
        name: { type: string }
        created_at: { type: string }
        updated_at: { type: string }
        client_uuid: { type: string, description: "The record's identity: the device's own if it sent one." }
        revision: { type: integer, minimum: 1, description: Bumped by every change. }

    LzFull:
      type: object
      required: [id, name, created_at, updated_at, client_uuid, revision, lz_data]
      properties:
        id: { type: integer }
        name: { type: string }
        created_at: { type: string }
        updated_at: { type: string }
        client_uuid: { type: string }
        revision: { type: integer, minimum: 1 }
        lz_data: { type: object, description: "The diagram document, schema 2 (see contracts/fixtures/workspace)." }

    RouteSummary:
      type: object
      required: [id, name, kind, has_file, created_at, updated_at, client_uuid, revision]
      properties:
        id: { type: integer }
        name: { type: string }
        kind: { type: string, enum: [sketch, mission], description: "A sketch is routes drawn in the app; a mission also holds the AMPS file the web imported." }
        file_name: { type: string, nullable: true }
        has_file: { type: boolean }
        created_at: { type: string }
        updated_at: { type: string }
        client_uuid: { type: string }
        revision: { type: integer, minimum: 1 }

    RouteFull:
      type: object
      required: [id, name, kind, has_file, created_at, updated_at, client_uuid, revision, route_data]
      properties:
        id: { type: integer }
        name: { type: string }
        kind: { type: string, enum: [sketch, mission] }
        file_name: { type: string, nullable: true }
        has_file: { type: boolean }
        created_at: { type: string }
        updated_at: { type: string }
        client_uuid: { type: string }
        revision: { type: integer, minimum: 1 }
        route_data: { type: object, description: "A sketch's `{ version: 1, routes: [...] }`; a mission's is a display summary." }

    PointList:
      type: array
      minItems: 1
      description: |
        The points of a local point set as the web keeps them: `{ id, name, description, group, icon, elevationFt, lat, lon }`,
        read from an AMPS `.LPS` file. The server does not look inside.
      items: { type: object }

    PointSetSummary:
      type: object
      required: [id, name, point_count, created_at, updated_at, client_uuid, revision]
      properties:
        id: { type: integer }
        name: { type: string }
        point_count: { type: integer, minimum: 0 }
        created_at: { type: string }
        updated_at: { type: string }
        client_uuid: { type: string }
        revision: { type: integer, minimum: 1 }

    PointSetFull:
      type: object
      required: [id, name, point_count, created_at, updated_at, client_uuid, revision, points]
      properties:
        id: { type: integer }
        name: { type: string }
        point_count: { type: integer, minimum: 0 }
        created_at: { type: string }
        updated_at: { type: string }
        client_uuid: { type: string }
        revision: { type: integer, minimum: 1 }
        points: { type: array, items: { type: object } }

    BriefSummary:
      type: object
      required: [id, name, created_at, updated_at, client_uuid, revision]
      properties:
        id: { type: integer }
        name: { type: string }
        created_at: { type: string }
        updated_at: { type: string }
        client_uuid: { type: string, description: "The record's identity: the device's own if it sent one." }
        revision: { type: integer, minimum: 1, description: Bumped by every change. }

    BriefFull:
      type: object
      required: [id, name, created_at, updated_at, client_uuid, revision, data]
      properties:
        id: { type: integer }
        name: { type: string }
        created_at: { type: string }
        updated_at: { type: string }
        client_uuid: { type: string }
        revision: { type: integer, minimum: 1 }
        data: { type: object, description: "The brief document (docs/MISSION_BRIEF.md §2.2)." }

    WeatherReport:
      type: object
      required: [station_id, name, temp_c, dewp_c, wind_spd_kts, wind_dir, wind_gust_kts, vis_sm, pressure, flight_category, raw_metar, distance_miles, notams]
      properties:
        station_id: { type: string, description: "The ICAO id, `UNKNOWN` when the report has none, `TIMEOUT` when no station answered." }
        name: { type: string, description: "The station's name; `AviationWeather API Offline` when none answered." }
        temp_c: { type: number, nullable: true }
        dewp_c: { type: number, nullable: true }
        wind_spd_kts: { type: number, nullable: true }
        wind_dir: { nullable: true, description: "Degrees true the wind is from, a number; `VRB` (text) for a variable wind; null with no report." }
        wind_gust_kts: { type: number, nullable: true }
        vis_sm: { nullable: true, description: "Statute miles: a number, or text such as `10+`; null with no report." }
        pressure: { description: "Altimeter in inches of mercury, a number rounded to hundredths, or the text `--` when there is none." }
        flight_category: { type: string, nullable: true, description: "VFR, MVFR, IFR or LIFR. A forecast's is worked out from its ceiling and visibility, null when it gives either not." }
        raw_metar: { type: string, nullable: true }
        distance_miles: { type: number, description: "How far the station is from the position, in statute miles; 0 when none answered." }
        kind: { type: string, enum: [observation, forecast], description: "Only when `at` was sent: what the answer is for that time." }
        at: { type: string, description: "Only with `at`: the time asked for, as UTC (`2026-10-16T14:30:00Z`)." }
        observed: { type: string, nullable: true, description: "An observation for `at` only: when the METAR was taken (UTC); null when no station answered." }
        raw_taf: { type: string, nullable: true, description: "A forecast only: the TAF's text." }
        issued: { type: string, nullable: true, description: "A forecast only: when the TAF was issued (UTC)." }
        valid_from: { type: string, nullable: true, description: "A forecast only: the start of the period covering `at` (UTC)." }
        valid_to: { type: string, nullable: true, description: "A forecast only: the end of that period (UTC)." }
        notams:
          description: |
            An object of lists of NOTAM text by the feature they are about (`{"Obstruction": ["…"]}`, or `{"Clear": ["No active NOTAMs in LZ area."]}` when
            there are none), or a sentence when the search could not be done (`NOTAM fetch failed.` or `NOTAMs currently unavailable.`).

    AircraftProfile:
      type: object
      additionalProperties: false
      required:
        - id
        - slug
        - name
        - designation
        - icon_key
        - is_system
        - rotor_diameter_m
        - rotor_tip_clearance_m
        - default_airspeed_kts
        - default_airspeed_type
        - max_indicated_kts
        - default_altitude_ft
        - default_altitude_ref
        - min_altitude_ft_msl
        - max_altitude_ft_msl
        - default_fuel_flow_lb_hr
        - default_gross_weight_lb
        - perf_source
        - amps_vehicle_description
        - has_template
        - template_kind
        - template_name
        - sort_order
      description: |
        An airframe's footprint, planning defaults and AMPS binding. The AMPS bytes
        themselves are never in this shape (`has_template` says whether there are
        any); `GET /api/aircraft-profiles/{id}/template` returns them.
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        designation: { type: string }
        icon_key: { type: string }
        is_system: { type: boolean, description: True for the admin's master list. }
        rotor_diameter_m: { type: number }
        rotor_tip_clearance_m: { type: number }
        default_airspeed_kts: { type: number }
        default_airspeed_type: { type: string, enum: [ground, indicated, true] }
        max_indicated_kts: { type: number }
        default_altitude_ft: { type: number }
        default_altitude_ref: { type: string, enum: [agl, msl] }
        min_altitude_ft_msl: { type: number }
        max_altitude_ft_msl: { type: number }
        default_fuel_flow_lb_hr: { type: number }
        default_gross_weight_lb: { type: number }
        perf_source: { type: string, enum: [vidx, published, custom] }
        amps_vehicle_description: { type: string, nullable: true }
        has_template: { type: boolean }
        template_kind: { type: string, nullable: true, description: "`msnx` or `vidx`." }
        template_name: { type: string, nullable: true }
        sort_order: { type: integer }
        client_uuid: { type: string, description: "The profile's identity. The caller's own profiles only." }
        revision: { type: integer, minimum: 1, description: "Bumped by every change. The caller's own profiles only." }

    AircraftProfileInput:
      type: object
      description: |
        What a user may set. Anything else is ignored. Numbers are range-checked
        (rotor 1 to 60 m, speeds 1 to 400 kt, and so on); a minimum altitude above
        the maximum is refused.
      properties:
        client_uuid: { type: string, description: "On create only: a UUID the device chose." }
        name: { type: string, maxLength: 120 }
        designation: { type: string, maxLength: 40 }
        icon_key: { type: string, maxLength: 40 }
        rotor_diameter_m: { type: number }
        rotor_tip_clearance_m: { type: number }
        default_airspeed_kts: { type: number }
        default_airspeed_type: { type: string, enum: [ground, indicated, true] }
        max_indicated_kts: { type: number }
        default_altitude_ft: { type: number }
        default_altitude_ref: { type: string, enum: [agl, msl] }
        min_altitude_ft_msl: { type: number }
        max_altitude_ft_msl: { type: number }
        default_fuel_flow_lb_hr: { type: number }
        default_gross_weight_lb: { type: number }
        amps_vehicle_description: { type: string, maxLength: 200 }

    Change:
      type: object
      required: [type, id, client_uuid, revision, deleted, name, seq, data]
      description: |
        One changed record. `type` says which collection: `lz`, `route`, `pointset`,
        `aircraft` (the caller's own profiles; the master list does not sync) or `brief`.
        A device passes over a `type` it does not know, which a newer server may add.
        A tombstone has `deleted: true`, an empty `name` and empty `data`. A route also
        has `kind`, `file_name` and `has_file`; fetch the mission file separately.
      properties:
        type: { type: string, enum: [lz, route, pointset, aircraft, brief] }
        id: { type: integer }
        client_uuid: { type: string }
        revision: { type: integer, minimum: 1 }
        deleted: { type: boolean }
        name: { type: string }
        created_at: { type: string, nullable: true }
        updated_at: { type: string, nullable: true }
        seq: { type: integer, minimum: 1, description: This change's place in the user's order. }
        kind: { type: string, description: "Routes only: `sketch` or `mission`." }
        file_name: { type: string, nullable: true }
        has_file: { type: boolean }
        data: { description: "lz_data, route_data, the points, the profile or the brief document, per `type`." }

    ChangeFeed:
      type: object
      additionalProperties: false
      required: [cursor, has_more, changes]
      properties:
        cursor: { type: integer, minimum: 0, description: "Send this as `since` next time. Equals `since` when nothing changed." }
        has_more: { type: boolean, description: Ask again at once. }
        changes:
          type: array
          items:
            $ref: "#/components/schemas/Change"

    Config:
      type: object
      additionalProperties: false
      required: [configVersion, serverVersion, apiVersion, apiMajors, minAppVersion, maintenance, services, mapbox]
      properties:
        configVersion:
          type: integer
          minimum: 1
          description: Bumped when the shape changes in a way an old app cannot read.
        serverVersion:
          type: string
          description: The backend's semantic version (the product's, shared with the web).
        apiVersion:
          type: string
          pattern: '^\d{1,4}\.\d{1,4}\.\d{1,4}$'
          description: |
            This spec's `info.version`: the API the server serves now. A server from before
            it was sent serves API 1.
        apiMajors:
          type: array
          minItems: 1
          items: { type: integer, minimum: 1 }
          description: |
            Every API major the server still answers: the current one, and any kept for apps
            not yet updated. An app that supports none of them is told to update (or, when
            the server is the older one, waits for it).
        minAppVersion:
          type: object
          additionalProperties: false
          required: [android, ios]
          description: |
            The oldest app version the server still supports, per platform, as
            `X.Y.Z`; null means no minimum. An app below it shows "Update required".
          properties:
            android:
              type: string
              nullable: true
              pattern: '^\d{1,4}\.\d{1,4}\.\d{1,4}$'
            ios:
              type: string
              nullable: true
              pattern: '^\d{1,4}\.\d{1,4}\.\d{1,4}$'
        maintenance:
          type: object
          additionalProperties: false
          required: [active, message]
          properties:
            active:
              type: boolean
            message:
              type: string
              nullable: true
              maxLength: 500
        services:
          type: object
          additionalProperties: false
          required: [lidarBuilds, packs]
          description: Optional services, so the app can hide what is down instead of failing.
          properties:
            lidarBuilds:
              type: boolean
              description: The 3D point-cloud build service is configured.
            packs:
              type: boolean
              description: The map-pack service (offline maps and terrain for an area; docs/NATIVE_APPS_PLAN.md) is configured. Not built yet. Unrelated to mission packs, the shared containers under /api/packs.
        mapbox:
          type: object
          additionalProperties: false
          required: [publicToken]
          properties:
            publicToken:
              type: string
              nullable: true
              pattern: '^pk\.'
              description: A *public* Mapbox token only; a secret one is never served.

    FieldAnalysis:
      type: object
      required: [status, suggested_lz, elevation, message]
      properties:
        status: { type: string, enum: [success] }
        suggested_lz:
          type: array
          description: The polygon of the area found, `[lat, lon]` pairs.
          items:
            type: array
            items: { type: number }
        elevation:
          type: string
          description: Ground elevation in feet (SRTM 30 m), or `TBD` when it could not be had.
        message: { type: string }

    SlopeStats:
      type: object
      required: [maxDeg, p95Deg, areaOver6Pct, areaOver10Pct, areaOver15Pct, sampleCount, sampleAreaM2]
      properties:
        maxDeg: { type: number }
        p95Deg: { type: number }
        areaOver6Pct: { type: number }
        areaOver10Pct: { type: number }
        areaOver15Pct: { type: number }
        sampleCount: { type: integer }
        sampleAreaM2: { type: number }

    ThreatRadar:
      type: object
      required: [type, rangeNmi]
      properties:
        type: { type: integer, description: "0 detection, 1 engagement." }
        rangeNmi: { type: number }
        antennaHeightFt: { type: number }
        aglNotMsl: { type: boolean }
        showMask: { type: boolean }
        showRangeRings: { type: boolean }
        bands:
          type: array
          items:
            type: object
            required: [altFt]
            properties:
              altFt: { type: number }
              color: { type: string, description: "`#RRGGBB`." }
              alpha: { type: number }
              colorIndex: { type: integer }
              viewable: { type: boolean }
    ThreatMask:
      type: object
      required: [bounds, radars]
      properties:
        bounds:
          type: array
          description: "`[[south, west], [north, east]]` of every raster."
          items:
            type: array
            items: { type: number }
        radars:
          type: array
          items:
            type: object
            required: [type, png]
            properties:
              type: { type: integer }
              png: { type: string, description: "A `data:image/png;base64,` raster over `bounds`, one colour per altitude band, the lowest band on top." }
    TerrainAnalysis:
      type: object
      required: [status, overlay, bounds, source, resolutionM, verticalDatum, stats, directional, byHeading, contours, profiles, thresholds]
      properties:
        status: { type: string, enum: [success] }
        overlay:
          type: string
          description: A `data:image/png;base64,` raster over `bounds`, banded by slope and transparent outside the polygon.
        bounds:
          type: array
          description: "`[[south, west], [north, east]]` of the raster."
          items:
            type: array
            items: { type: number }
        source:
          type: string
          description: Which terrain source answered, for example `local_highres_cog` or `terrarium`.
        resolutionM: { type: number }
        verticalDatum: { type: string }
        stats:
          $ref: "#/components/schemas/SlopeStats"
        directional:
          type: object
          nullable: true
          description: |
            Null when no landing heading was sent. Percentages are of the polygon's area that is over
            the UH-60 limit in `thresholds` for that direction.
          required: [headingDeg, noseHighMaxDeg, noseLowMaxDeg, crossSlopeMaxDeg, noseHighOverLimitPct, noseLowOverLimitPct, crossSlopeOverLimitPct]
          properties:
            headingDeg: { type: number }
            noseHighMaxDeg: { type: number }
            noseLowMaxDeg: { type: number }
            crossSlopeMaxDeg: { type: number }
            noseHighOverLimitPct: { type: number }
            noseLowOverLimitPct: { type: number }
            crossSlopeOverLimitPct: { type: number }
        byHeading:
          type: array
          description: |
            The steepest slope over the polygon for each whole heading, 0 to 359 in order (360
            entries), worked out as `directional` is and rounded to 0.1°: nose high is the ground
            rising ahead (the nose up), nose low the ground falling away (the nose down), and the
            cross slope is either side. A client judges any landing heading from this without asking
            again (it applies the wind to the limits itself). Headings are the
            terrain grid's: true north over the Terrarium tiles, the UTM grid's north over a local
            DEM. A server from before this field sends none, and a client must keep working without it.
          items:
            type: object
            additionalProperties: false
            required: [heading, noseHighMaxDeg, noseLowMaxDeg, crossSlopeMaxDeg]
            properties:
              heading: { type: integer, minimum: 0, maximum: 359 }
              noseHighMaxDeg: { type: number, minimum: 0 }
              noseLowMaxDeg: { type: number, minimum: 0 }
              crossSlopeMaxDeg: { type: number, minimum: 0 }
        contours:
          type: object
          description: |
            Contour lines of the ground in the polygon and a 40 m ring round it, so a crew can read its
            shape: in feet, at `intervalFt` (the finest of 1, 2, 5, 10, 20, 25, 50 and 100 that keeps
            the ground to about a dozen lines), from the same grid as the slope, lightly smoothed. Each
            entry of `lines` is one piece of a contour: wholly `inside` the polygon or wholly in the ring
            outside it (pieces that meet share their joining point), every fifth interval `major`, and
            the longest inside piece of a height carries a `label` point for its number, placed at least
            40 m from every other (major heights first), so some minor heights have none. Heights are
            the source's own (`verticalDatum`). A server from before this field sends none, and a client
            must keep working without it.
          additionalProperties: false
          required: [intervalFt, lines]
          properties:
            intervalFt: { type: integer, minimum: 1 }
            lines:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [elevationFt, major, inside, points, label]
                properties:
                  elevationFt: { type: integer }
                  major: { type: boolean }
                  inside: { type: boolean }
                  points:
                    type: array
                    description: "`[lat, lon]` pairs, two or more; a ring's last is its first."
                    items:
                      type: array
                      items: { type: number }
                  label:
                    type: array
                    nullable: true
                    description: "`[lat, lon]` where the height's number goes, on this piece; null on every other piece."
                    items: { type: number }
        profiles:
          type: object
          nullable: true
          description: |
            The ground along straight lines through the polygon's middle (`center`, its area centroid), for
            the slope profile a client draws along and across the landing heading: one line for each
            heading 0, 2, … 178 (`headingStepDeg`), reaching `halfLengthM` each way (300 m past the
            polygon's farthest corner), its heights in feet every `stepM` from `halfLengthM` behind the
            middle (the way the heading points from) to `halfLengthM` ahead, null where the terrain has
            none; and `lz`, where the line crosses the boundary, in metres from the middle (behind
            negative), or null. A heading of 180 or more is the opposite line read backwards. Headings
            are true. Null when no terrain covers the ground round the polygon (a local source must
            cover it whole). A server from before this field sends none, and a client must keep working
            without it.
          additionalProperties: false
          required: [center, stepM, halfLengthM, headingStepDeg, lines]
          properties:
            center:
              type: array
              items: { type: number }
            stepM: { type: number }
            halfLengthM: { type: number }
            headingStepDeg: { type: integer }
            lines:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [heading, elevationsFt, lz]
                properties:
                  heading: { type: integer, minimum: 0, maximum: 179 }
                  elevationsFt:
                    type: array
                    items: { type: number, nullable: true }
                  lz:
                    type: array
                    nullable: true
                    items: { type: number }
        thresholds:
          type: object
          required: [bands, uh60]
          properties:
            bands:
              type: array
              description: The slope band edges in degrees the raster is coloured by.
              items: { type: number }
            uh60:
              type: object
              required: [noseHigh, noseLow, crossSlope]
              description: |
                The UH-60 slope landing limits in degrees with no wind: 15 nose high (nose up), 6
                nose low (nose down), 15 cross slope. A client reduces them for the wind.
              properties:
                noseHigh: { type: number }
                noseLow: { type: number }
                crossSlope: { type: number }

    # -- Mission packs -----------------------------------------------------------------------

    Person:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: integer, nullable: true, description: "Null once the account is deleted (the name is kept as it was)." }
        name: { type: string }

    Status:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [deleted, removed] }

    PackError:
      type: object
      required: [error]
      description: |
        `error` is for people; `code` is stable and meant for the app: `pack_not_found`,
        `pack_read_only` (a viewer), `owner_only`, `pack_finished` (423, with who finished it and
        when), `invalid_batch`, `invalid_op` (with `index` and the `reason` from
        contracts/fixtures/packs/ops.json, or `bad_client_op_id`, `bad_summary`), `item_too_large`
        (413, with `item`), `invalid_name`, `invalid_description`, `invalid_uuid`, `uuid_taken`,
        `not_in_team`, `invalid_role`, `invalid_source`, `invalid_item`, `source_not_found`,
        `mission_not_supported`, `unreadable_source`, `item_exists`, `item_not_found`,
        `not_your_original`, `original_gone`, `original_unknown`, `empty_point_set`, `feature_disabled`,
        `not_a_teammate`, `already_member`, `member_not_found`, `owner_must_transfer`,
        `invalid_email`, `invite_not_found`, `invite_gone` / `invite_expired` (410),
        `rate_limited` (429), `team_not_found`, `team_managers_only`, `invalid_query`.
      properties:
        error: { type: string }
        code: { type: string }
        index: { type: integer }
        reason: { type: string }
        item: { type: string }
        finished_at: { type: string, nullable: true }
        finished_by:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Person" }]
        taken:
          type: array
          description: |
            On `POST /api/packs/{uuid}/ops` only, and always on its 403 `pack_read_only`, 413
            `item_too_large` and 423 `pack_finished`: the operations of the refused batch the pack
            already has (the caller's own, in log order, possibly none). They were taken by an
            earlier send of the batch whose answer was lost; the rest of the batch was not taken.
          items: { $ref: "#/components/schemas/PackOpResult" }

    PackTeam:
      type: object
      additionalProperties: false
      required: [id, name, member_count, role]
      properties:
        id: { type: integer }
        name: { type: string }
        member_count: { type: integer, minimum: 0 }
        role: { type: string, enum: [editor, viewer], description: What the team's members may do in the pack. }

    PackSummary:
      type: object
      additionalProperties: false
      required: [uuid, name, description, status, role, owner, team, head_seq, seen_seq, member_count, audience_count,
                 item_count, item_counts, finished_at, finished_by, created_at, updated_at]
      properties:
        uuid: { type: string }
        name: { type: string }
        description: { type: string }
        status: { type: string, enum: [active, finished], description: "finished: read-only for everyone." }
        role: { type: string, enum: [owner, editor, viewer], description: The caller's. }
        owner: { $ref: "#/components/schemas/Person" }
        team:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/PackTeam" }]
        head_seq: { type: integer, minimum: 0, description: The number of the pack's latest event. }
        seen_seq: { type: integer, minimum: 0, description: "The newest event the caller has seen (PUT .../seen); 0 if never." }
        member_count: { type: integer, minimum: 0, description: "Members in their own right, not counting a shared team." }
        audience_count:
          type: integer
          minimum: 0
          description: "Everyone who can open the pack, each once: its members and the members of the team it is shared with."
        item_count: { type: integer, minimum: 0 }
        item_counts: { $ref: "#/components/schemas/PackItemCounts" }
        finished_at: { type: string, nullable: true }
        finished_by:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Person" }]
        created_at: { type: string }
        updated_at: { type: string }

    Pack:
      type: object
      additionalProperties: false
      required: [uuid, name, description, status, role, owner, team, head_seq, seen_seq, member_count, audience_count,
                 item_count, item_counts, finished_at, finished_by, created_at, updated_at, members, items, live_url]
      description: A PackSummary, with its members and every live item, as of `head_seq`.
      properties:
        uuid: { type: string }
        name: { type: string }
        description: { type: string }
        status: { type: string, enum: [active, finished] }
        role: { type: string, enum: [owner, editor, viewer] }
        owner: { $ref: "#/components/schemas/Person" }
        team:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/PackTeam" }]
        head_seq: { type: integer, minimum: 0 }
        seen_seq: { type: integer, minimum: 0 }
        member_count: { type: integer, minimum: 0 }
        audience_count: { type: integer, minimum: 0 }
        item_count: { type: integer, minimum: 0 }
        item_counts: { $ref: "#/components/schemas/PackItemCounts" }
        finished_at: { type: string, nullable: true }
        finished_by:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Person" }]
        created_at: { type: string }
        updated_at: { type: string }
        members:
          type: array
          items: { $ref: "#/components/schemas/PackMember" }
        items:
          type: array
          items: { $ref: "#/components/schemas/PackItem" }
        live_url:
          type: string
          nullable: true
          pattern: '^wss?://'
          description: |
            Where to open the live stream for this pack (docs/MISSION_PACKS.md, "The live stream"). Null when
            this deployment has no live service: poll `GET /api/packs/{uuid}/events` instead.

    PackItemCounts:
      type: object
      additionalProperties: false
      required: [lz, route, pointset]
      description: Live items by kind.
      properties:
        lz: { type: integer, minimum: 0 }
        route: { type: integer, minimum: 0 }
        pointset: { type: integer, minimum: 0 }

    PackMember:
      type: object
      additionalProperties: false
      required: [user_id, name, email, role, added_at, seen_at]
      properties:
        user_id: { type: integer }
        name: { type: string }
        email: { type: string, description: The sign-in address. }
        role: { type: string, enum: [owner, editor, viewer] }
        added_at: { type: string }
        seen_at: { type: string, nullable: true, description: When they last looked at the pack (PUT .../seen); null if never. }

    PackMemberReply:
      type: object
      additionalProperties: false
      required: [member]
      properties:
        member: { $ref: "#/components/schemas/PackMember" }

    PackItem:
      type: object
      additionalProperties: false
      required: [uuid, kind, name, revision, seq, created_by, updated_by, created_at, updated_at, source]
      properties:
        uuid: { type: string }
        kind: { type: string, enum: [lz, route, pointset, brief] }
        name: { type: string }
        revision: { type: integer, minimum: 1, description: Bumped by every applied operation. }
        seq: { type: integer, minimum: 0, description: The event that last changed it. }
        created_by:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Person" }]
        updated_by:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Person" }]
        created_at: { type: string }
        updated_at: { type: string }
        source:
          type: object
          nullable: true
          additionalProperties: false
          description: Where a copy from someone's library came from. Null for an item made in the pack.
          required: [kind, uuid, revision, original, original_updated_at, pack_changes, last_pack_change]
          properties:
            kind: { type: string, enum: [lz, route, pointset] }
            uuid:
              type: string
              nullable: true
              description: |
                The original's `client_uuid`. Copying in a record saved before sync gives it one first;
                null only for a copy made before that was so, which cannot be traced to its original.
            revision: { type: integer }
            original:
              type: string
              nullable: true
              enum: [same, changed, deleted]
              description: |
                Only for the member who copied it in (the original is their private record); null for
                everyone else, and for a copy whose `uuid` is null.
            original_updated_at:
              type: string
              nullable: true
              description: |
                When the original last changed, while it is `same` or `changed`; null otherwise and for
                everyone but the member who copied it in.
            pack_changes:
              type: integer
              nullable: true
              minimum: 0
              description: |
                While `original` is `changed`: the edits made to the item's content in the pack since it
                was copied in or last updated from the original, which updating would replace. Operations
                sent as one edit (one after another, by one person, with one summary) count once; a rename
                is not counted, since updating keeps the name. Null otherwise.
            last_pack_change:
              type: object
              nullable: true
              additionalProperties: false
              description: The newest of those edits, while `pack_changes` is above 0; null otherwise.
              required: [actor, summary, created_at]
              properties:
                actor:
                  type: object
                  additionalProperties: false
                  required: [id, name]
                  description: Who made it, as the log has them (id null for a deleted account).
                  properties:
                    id: { type: integer, nullable: true }
                    name: { type: string }
                summary: { type: string, description: The edit's sentence in the History panel. }
                created_at: { type: string }
        data:
          description: The same JSON the library keeps (lz_data, route_data, or the list of points). Present wherever the item is returned whole.

    PackEvent:
      type: object
      additionalProperties: false
      required: [seq, type, item, actor, summary, status, reason, client_op_id, op, created_at]
      properties:
        seq: { type: integer, minimum: 1 }
        type:
          type: string
          description: |
            An item operation (`item.create`, `item.delete`, `item.rename`, `item.replace`, `set`, `patch`,
            `upsert`, `insert`, `remove`) or a pack event (`pack.create`, `pack.update`, `pack.share`,
            `pack.finish`, `pack.reopen`, `pack.transfer`, `member.add`, `member.join`, `member.role`,
            `member.remove`, `invite.create`, `invite.revoke`). A client applies the first kind with its
            applier and reads the second for the pack's state; a type it does not know, it skips.
        item: { type: string, nullable: true }
        actor:
          type: object
          additionalProperties: false
          required: [id, name]
          description: "Who made the change; id null for the server's own (name `EZ-PZ`) or a deleted account."
          properties:
            id: { type: integer, nullable: true }
            name: { type: string }
        summary: { type: string, description: 'The sentence for the History panel, e.g. "Colin moved Chalk 2 on LZ Hawk".' }
        status: { type: string, enum: [applied, skipped] }
        reason: { type: string, nullable: true, description: Why it was skipped (contracts/fixtures/packs/ops.json). }
        client_op_id: { type: string, nullable: true }
        op:
          type: object
          required: [type]
          description: The operation itself, as applied (without `client_op_id` and `summary`).
        created_at: { type: string }

    PackOpsResult:
      type: object
      additionalProperties: false
      required: [head_seq, results, events, has_more]
      properties:
        head_seq: { type: integer, minimum: 0 }
        results:
          type: array
          description: One per operation sent, in order.
          items: { $ref: "#/components/schemas/PackOpResult" }
        events:
          type: array
          items: { $ref: "#/components/schemas/PackEvent" }
        has_more: { type: boolean }

    PackOpResult:
      type: object
      additionalProperties: false
      required: [client_op_id, seq, status, reason]
      description: How one operation went, as the pack's log has it.
      properties:
        client_op_id: { type: string }
        seq: { type: integer, minimum: 1 }
        status: { type: string, enum: [applied, skipped] }
        reason: { type: string, nullable: true, description: "Why it was skipped (contracts/fixtures/packs/ops.json); null when applied." }

    PackEventPage:
      type: object
      additionalProperties: false
      required: [events, cursor, has_more, head_seq]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/PackEvent" }
        cursor: { type: integer, minimum: 0, description: Send this as `since` next time. }
        has_more: { type: boolean }
        head_seq: { type: integer, minimum: 0 }

    PackItemReply:
      type: object
      additionalProperties: false
      required: [item, event, head_seq]
      properties:
        item: { $ref: "#/components/schemas/PackItem" }
        event:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/PackEvent" }]
        head_seq: { type: integer, minimum: 0 }

    LibraryCopy:
      type: object
      additionalProperties: false
      required: [kind, id, client_uuid, name, revision]
      properties:
        kind: { type: string, enum: [lz, route, pointset, brief] }
        id: { type: integer }
        client_uuid: { type: string }
        name: { type: string }
        revision: { type: integer, minimum: 1 }

    Invite:
      type: object
      additionalProperties: false
      required: [id, email, role, status, invited_by, expires_at, created_at, pack, team]
      properties:
        id: { type: integer }
        email: { type: string, nullable: true, description: "Null for a team's single-use link." }
        role: { type: string, enum: [editor, viewer, admin, member] }
        status: { type: string, enum: [pending, accepted, declined, revoked, expired] }
        invited_by:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Person" }]
        expires_at: { type: string }
        created_at: { type: string }
        pack:
          type: object
          nullable: true
          additionalProperties: false
          required: [uuid, name]
          properties:
            uuid: { type: string }
            name: { type: string }
        team:
          type: object
          nullable: true
          additionalProperties: false
          required: [id, name]
          properties:
            id: { type: integer }
            name: { type: string }

    InviteOnly:
      type: object
      additionalProperties: false
      required: [invite]
      properties:
        invite: { $ref: "#/components/schemas/Invite" }

    InviteList:
      type: object
      additionalProperties: false
      required: [invites]
      properties:
        invites:
          type: array
          items: { $ref: "#/components/schemas/Invite" }

    InviteReply:
      type: object
      additionalProperties: false
      required: [invite]
      properties:
        invite: { $ref: "#/components/schemas/Invite" }
        email_sent: { type: boolean, description: Present for an emailed invitation. }
        token: { type: string, description: "A team link's token: shown here once, never again." }

    InviteAccepted:
      type: object
      additionalProperties: false
      required: [invite, pack, team]
      properties:
        invite: { $ref: "#/components/schemas/Invite" }
        pack:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/PackSummary" }]
        team:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/TeamSummary" }]

    TeamSummary:
      type: object
      additionalProperties: false
      required: [id, name, role, member_count, created_at]
      properties:
        id: { type: integer }
        name: { type: string }
        role: { type: string, enum: [owner, admin, member], description: The caller's. }
        member_count: { type: integer, minimum: 1 }
        created_at: { type: string }

    Team:
      type: object
      additionalProperties: false
      required: [id, name, role, member_count, created_at, members]
      properties:
        id: { type: integer }
        name: { type: string }
        role: { type: string, enum: [owner, admin, member] }
        member_count: { type: integer, minimum: 1 }
        created_at: { type: string }
        members:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [user_id, name, email, role, joined_at]
            properties:
              user_id: { type: integer }
              name: { type: string }
              email: { type: string }
              role: { type: string, enum: [owner, admin, member] }
              joined_at: { type: string }

    UserBrief:
      type: object
      additionalProperties: false
      required: [id, name, email]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, description: The sign-in address. }
