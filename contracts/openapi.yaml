      responses:
        "200":
          description: Saved (or recognised as a retry, which answers the whole record).
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BriefSummary"
        "400":
          $ref: "#/components/responses/SimpleError"
        "404":
          $ref: "#/components/responses/SimpleError"
        "409":
          $ref: "#/components/responses/BriefConflict"
    delete:
      operationId: deleteBrief
      summary: Delete a saved mission brief
      description: |
        Leaves a tombstone, with the content gone, so devices learn of the deletion through `/api/sync/changes`.
        Deleting twice is not an error. A stale `If-Match` is a 409 and deletes nothing.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [deleted] }
                  revision: { type: integer }
        "404":
          $ref: "#/components/responses/SimpleError"
        "409":
          $ref: "#/components/responses/BriefConflict"

  /api/brief/pdf:
    post:
      operationId: printBrief
      summary: Print a mission brief as a PDF
      description: |
        The brief the client compiled (compileBrief's model: docs/MISSION_BRIEF.md §2.3) laid out as pages and printed
        by Gotenberg on the server (§2.7): its figures drawn from the model's geometry over the base map
        `options.figureMap` names, on the paper `options.paper` names. Its strip charts (`model.strips`, each with the MGRS
        grid the client adds as `grid`) are drawn turned course up on the map `options.stripMap` names; a strip that is
        not the printed 5.5 by 21.5 cm at its scale, or will not draw, is left out. Nothing is kept: neither the model nor
        the PDF.
        Needs `mission_brief`. A heavy request: other work on the server waits for it.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model]
              properties:
                model: { description: "The compiled brief (format ezpz-brief-model).", type: object }
      responses:
        "200":
          description: The PDF, as an attachment.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "400":
          description: "`invalid_brief`: the body is not a brief model."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }
        "403":
          description: "`feature_disabled`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }
        "413":
          description: "`too_large`: more than 4 MB."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }
        "502":
          description: "`pdf_failed`: Gotenberg did not print it."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }
        "503":
          description: "`pdf_unavailable`: this server has no Gotenberg (`GOTENBERG_URL`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }
  /api/weather:
    get:
      operationId: weather
      summary: "The weather at a position, from the nearest station's report and the NOTAMs around it"
      description: |
        Looks up the nearest METAR within a degree or so of the position and the FAA NOTAMs within 10 nm. The services behind it are other people's, so
        the answer is **always 200** with what could be had: when no station answers, `station_id` is `TIMEOUT`, the numbers are null and `pressure` is
        `"--"`; when the NOTAM search is down, `notams` is a sentence instead of an object. A caller shows both without treating them as errors.

        With `at`, a planned time (a brief's, docs/MISSION_BRIEF.md §2.5), the answer is for then: a time more than 30 minutes ahead is answered
        from the nearest TAF with a period covering it (`kind: "forecast"`, its station in `station_id`, the period in `valid_from` and
        `valid_to`, and no temperature, dew point or METAR, which a TAF does not give); a time sooner, in the past, or that no TAF nearby covers,
        from the latest METAR as without `at` (`kind: "observation"`, with the report's time in `observed`). The NOTAMs are those in force now
        either way. Without `at` the answer is exactly as it always was, with none of these fields.
      security:
        - bearer: []
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number }
        - name: lng
          in: query
          required: true
          schema: { type: number }
        - name: at
          in: query
          required: false
          description: An ISO 8601 time, e.g. `2026-10-16T14:30:00Z`; one without an offset is UTC. Anything else is 400 `invalid_at`.
          schema: { type: string, maxLength: 40 }
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeatherReport"
        "400":
          $ref: "#/components/responses/SimpleError"
        "500":
          $ref: "#/components/responses/SimpleError"

  /api/aircraft-profiles:
    get:
      operationId: listAircraftProfiles
      summary: The master aircraft list, then the caller's own profiles
      description: |
        Active master profiles (`is_system: true`, the admin's list) followed by the
        caller's own live profiles. Only the caller's own carry `client_uuid` and
        `revision`: the master list does not sync, so a device refetches it.
      security:
        - bearer: []
      responses:
        "200":
          description: Master profiles first, then the caller's.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AircraftProfile"
    post:
      operationId: createAircraftProfile
      summary: Make a custom aircraft profile
      description: |
        Needs the `aircraft_profiles` entitlement. Anything left out takes a default.
        Send `client_uuid` so a retry after a lost response returns the first profile
        (200) instead of making a second (201). `perf_source`, `is_active` and
        `sort_order` are the admin's and are ignored here.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AircraftProfileInput"
      responses:
        "201":
          description: Created.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AircraftProfile"
        "200":
          description: A profile with this `client_uuid` already existed; here it is.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AircraftProfile"
        "400":
          $ref: "#/components/responses/AircraftError"
        "403":
          $ref: "#/components/responses/SimpleError"

  /api/aircraft-profiles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    put:
      operationId: updateAircraftProfile
      summary: Edit one of the caller's own profiles
      description: |
        Only what is sent changes. `If-Match`, conflicts and `Idempotency-Key` work as
        they do for a saved LZ. A master profile, or another user's, is a 404.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AircraftProfileInput"
      responses:
        "200":
          description: Saved (or recognised as a retry).
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AircraftProfile"
        "400":
          $ref: "#/components/responses/AircraftError"
        "403":
          $ref: "#/components/responses/SimpleError"
        "404":
          $ref: "#/components/responses/SimpleError"
        "409":
          $ref: "#/components/responses/AircraftConflict"
    delete:
      operationId: deleteAircraftProfile
      summary: Delete one of the caller's own profiles
      description: |
        Leaves a tombstone, with the airframe's details and any AMPS bytes gone, so
        devices learn of the deletion through `/api/sync/changes`. Deleting twice is
        not an error. A stale `If-Match` is a 409 and deletes nothing.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [deleted] }
                  revision: { type: integer }
        "403":
          $ref: "#/components/responses/SimpleError"
        "404":
          $ref: "#/components/responses/SimpleError"
        "409":
          $ref: "#/components/responses/AircraftConflict"

  /api/analyze-field:
    post:
      operationId: analyzeField
      summary: Find the landing area around a target, and the ground elevation there
      description: |
        Runs the segmentation model on the satellite tile around `lat`/`lon` and returns the area
        it finds as a polygon (`suggested_lz`, `[lat, lon]` pairs), with the ground elevation in
        feet as a string (`"TBD"` when the elevation service could not be reached). One analysis
        runs at a time on the server, and it can take many seconds: an app shows progress and may
        stop waiting. A failure is `{status: "error", message}`, a shape of its own that this route
        has always had.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lon]
              properties:
                lat: { type: number }
                lon: { type: number }
      responses:
        "200":
          description: An area was found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldAnalysis"
        "400":
          $ref: "#/components/responses/FieldError"
        "500":
          $ref: "#/components/responses/FieldError"

  /api/terrain-analysis:
    post:
      operationId: terrainAnalysis
      summary: Slope over a landing-zone boundary
      description: |
        Slope from the best terrain source that covers the polygon, clipped to it: a transparent
        banded raster (`overlay`, a PNG data URI) placed at `bounds`, statistics over the polygon,
        the steepest nose-high, nose-low and cross slope for every whole heading (`byHeading`), and,
        when a `landingHeading` is given, the nose-high, nose-low and cross-slope summary for that
        heading against the UH-60 limits in `thresholds`. `directional` is null without a heading.
        Errors are `{error}`.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [polygon]
              properties:
                polygon:
                  type: array
                  description: At least three `[lat, lon]` pairs.
                  items:
                    type: array
                    items: { type: number }
                landingHeading:
                  type: number
                  nullable: true
                  description: Degrees true. Absent or null for no directional summary.
      responses:
        "200":
          description: The analysis.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerrainAnalysis"
        "400":
          $ref: "#/components/responses/SimpleError"
        "500":
          $ref: "#/components/responses/SimpleError"
        "502":
          $ref: "#/components/responses/SimpleError"

  /api/threat-mask:
    post:
      operationId: threatMask
      summary: What a threat's radars can see over the terrain
      description: |
        A viewshed for each radar that asks for a mask (`showMask`), over the open Terrarium elevation tiles: where an aircraft flying at each of the radar's altitude bands (`bands`,
        those that are `viewable`) is in line of sight of its antenna, with earth curvature and refraction, as a coloured PNG (`png`, a data URI) over `bounds`. A radar that does not ask,
        or has no viewable band, or sees nothing, has no entry. **The position and radars are used for this one answer and are not kept**: nothing is written, and the app asks only when
        the person presses the button, since threats are otherwise never sent anywhere. Errors are `{error}`.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lon, radars]
              properties:
                lat: { type: number }
                lon: { type: number }
                radars:
                  type: array
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/ThreatRadar"
      responses:
        "200":
          description: The masks. `radars` is empty when no radar had anything to show.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreatMask"
        "400":
          $ref: "#/components/responses/SimpleError"
        "500":
          $ref: "#/components/responses/SimpleError"
        "502":
          $ref: "#/components/responses/SimpleError"

  /api/elevations:
    post:
      operationId: elevations
      summary: Ground elevation at each of a route's points
      description: |
        Samples the open Terrarium elevation tiles on the server, in whole feet, one answer for each point in
        the order sent. A point whose tile could not be read is `null`. A failure while sampling is
        still a 200 with `error` set and every elevation `null`, which an app treats the same as no
        answer: planning goes on without ground elevations. No points is an empty list.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [points]
              properties:
                points:
                  type: array
                  items:
                    type: object
                    required: [lat, lon]
                    properties:
                      lat: { type: number }
                      lon: { type: number }
      responses:
        "200":
          description: The elevations.
          content:
            application/json:
              schema:
                type: object
                required: [elevationsFt]
                properties:
                  elevationsFt:
                    type: array
                    items: { type: integer, nullable: true }
                  error:
                    type: string
                    description: Set when sampling failed; every elevation is then null.
        "400":
          $ref: "#/components/responses/SimpleError"

  /api/route-winds:
    post:
      operationId: routeWinds
      summary: Wind at each of a route's points, from the nearest weather station
      description: |
        For each point the nearest station is used. A point wanted more than about 30 minutes from now
        takes its wind from that station's forecast (`source: TAF`); any other point from the latest
        observation (`METAR`). A point with no station in reach is left out of `winds`. `time` is an ISO
        instant in UTC, or absent. `dirTrue` is where the wind blows FROM, 0 when it is variable (then
        `variable` is true).
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [points]
              properties:
                points:
                  type: array
                  items:
                    type: object
                    required: [id, lat, lon]
                    properties:
                      id: { type: string }
                      lat: { type: number }
                      lon: { type: number }
                      time: { type: string, nullable: true }
      responses:
        "200":
          description: The winds, by point id.
          content:
            application/json:
              schema:
                type: object
                required: [winds]
                properties:
                  winds:
                    type: object
                    additionalProperties:
                      $ref: "#/components/schemas/PointWind"
        "500":
          $ref: "#/components/responses/SimpleError"

  # -- The 3D LZ view (docs/ANDROID_3D_PLAN.md) -------------------------------------------
  # Coordinates only ever travel in POST bodies. A build's progress and a tileset's files are
  # addressed by an opaque key, so where an LZ is never lands in a URL or a request log.

  /api/lidar/resolve:
    post:
      operationId: lidarResolve
      summary: The point cloud that covers a place, and whether it is built
      description: |
        The key of a built tileset whose area holds the place (nearest centre first), else the key a
        build of it would have. Built: `available` is true, `url` is the tileset's root and `contextUrl`
        a thinned ring round it (null when none was built). Both are relative to the API's root, as
        `/lidar/tilesets/<key>/tileset.json`: the app puts its own base in front (the web's base ends in
        `/api`, so these must not repeat it). Not built: `available` is false, `canBuild` says whether
        `POST /api/lidar/build` can do anything on this server, and `target` echoes the caller's own
        place, so a client can say what to build. `radius_m` is 50 to 2,000 (default 500).

        Streamed (docs/DATA_ADMIN_AND_PREBUILT_3D_PLAN.md, Part C): a client that sends `stream: true`
        and whose place nothing built covers is answered, where this server streams and USGS has a
        survey there, with that survey's tileset, `streamed: true` and `frame`. The tileset is a whole
        survey, a state's octree, so the client opens the view, and its *LZ* button, on `frame` (the
        caller's place, its radius and the ground's ellipsoidal height there, null where nothing says
        it), never on the tileset's own sphere. A client that does not send it is answered as before.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LidarTarget"
      responses:
        "200":
          description: The key, and the tileset's place when it is built.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LidarResolve"
        "400":
          $ref: "#/components/responses/SimpleError"

  /api/lidar/build:
    post:
      operationId: lidarBuild
      summary: Ask for a point cloud to be built
      description: |
        Idempotent: asking again while a build is queued or running answers that build, and a place
        already built answers 200 with `state: done` and the tileset's place (as `resolve` gives it).
        Otherwise the build service queues it and the answer is 202 with the job. `watcher` is an
        opaque id of whoever waits (`^[A-Za-z0-9_-]{8,64}$`; anything else is dropped): the service
        drops a build nobody has asked after for 90 s, unless `keep` (a saved LZ/PZ) asks it to finish
        regardless. Builds someone is watching run first. `radius_m` is 50 to 1,000 here. Without a
        build service: 503 `builder_not_configured`; the service unreachable: 503 `builder_unavailable`;
        its queue full: 429 `builder_busy`.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lon]
              properties:
                lat: { type: number }
                lon: { type: number }
                radius_m: { type: number, minimum: 50, maximum: 1000 }
                keep: { type: boolean, description: "Finish the build even once nobody waits for it." }
                watcher: { type: string }
      responses:
        "200":
          description: The place is built already.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LidarBuild"
        "202":
          description: The build, queued or under way.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LidarBuild"
        "400":
          $ref: "#/components/responses/SimpleError"
        "429":
          $ref: "#/components/responses/SimpleError"
        "503":
          $ref: "#/components/responses/SimpleError"

  /api/lidar/build/{key}:
    get:
      operationId: lidarBuildStatus
      summary: How a build is going
      description: |
        Asking counts as still waiting for it (polled every 3 s while someone waits). `keep=1` marks it
        to be finished regardless, as when the LZ/PZ was saved while it built. A build the service has
        no record of is 404 `no_build` (a restarted service forgets its queue: ask for the build again).
        Done: `state: done` with the tileset's place.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
        - $ref: "#/components/parameters/LidarKey"
        - $ref: "#/components/parameters/LidarWatcher"
        - name: keep
          in: query
          required: false
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: The build.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LidarBuild"
        "400":
          $ref: "#/components/responses/SimpleError"
        "404":
          $ref: "#/components/responses/SimpleError"
        "503":
          $ref: "#/components/responses/SimpleError"
    delete:
      operationId: lidarBuildRelease
      summary: Stop waiting for a build
      description: |
        The service drops the build if nobody else is waiting and it was not kept. A build the service
        never had, or a server without a build service, answers 204. Nothing to read in a 200 that the
        app needs: it is sent when the view closes and its answer is not waited for.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
        - $ref: "#/components/parameters/LidarKey"
        - $ref: "#/components/parameters/LidarWatcher"
      responses:
        "200":
          description: The build as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LidarBuild"
        "204":
          description: Nothing to release.
        "400":
          $ref: "#/components/responses/SimpleError"
        "503":
          $ref: "#/components/responses/SimpleError"

  /api/lidar/tilesets/{key}/{file}:
    get:
      operationId: lidarTilesetFile
      summary: One file of a tileset, its root or one of its tiles
      description: |
        A 3D Tiles 1.0 tileset as py3dtiles 12.1.1 writes it, unchanged (backend/lidar/tiles.py): the
        root `tileset.json`, and `.pnts` tiles (`POSITION` float32 and `RGB` uint8, in the tile's frame:
        each tile's `transform`, translation then scale, composed down from the root). `file` is a path
        inside the tileset and may hold slashes (`points/r0.pnts`, `context/tileset.json`); a tile's
        `content.uri` is relative to the tileset.json that names it. A file that is not there is 404
        (Flask's own page, not JSON). Private and cached a week: a key's content never changes.

        A streamed survey (`resolve`'s `streamed`) is written from USGS's own octree: its files are
        `tileset.json` and `<16 hex>.json` (external tilesets, one every four levels) and `<16 hex>.pnts`,
        names that say nothing of the place. Tiles have a `region` and `refine: ADD`; its `.pnts` carry
        `POSITION_QUANTIZED` (with `QUANTIZED_VOLUME_OFFSET` and `QUANTIZED_VOLUME_SCALE`, in WGS84
        geocentric metres, no `transform`) and `RGB`: first a natural palette, kept an hour
        (`max-age=3600`), then, once the server has laid USDA NAIP imagery on it in the background,
        photographic, kept the week. The points never move between the two. A piece is fetched from AWS the
        first time anyone asks for it: AWS unreachable is 502 `upstream_unavailable`, a server without
        its geoid grids 503 `geoid_unavailable` (heights would be about 30 m out), and a name never
        handed out a JSON 404 `not_found`; each is worth asking again later but the last.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
        - $ref: "#/components/parameters/LidarKey"
        - name: file
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The file.
          headers:
            Cache-Control:
              schema: { type: string, example: "private, max-age=604800" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tileset"
            application/octet-stream:
              schema: { type: string, format: binary }
        "400":
          $ref: "#/components/responses/SimpleError"
        "404":
          description: No such tileset (`{error}`), no such file in it (Flask's own page, not JSON), or a file it does not serve (`{error}`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleError"
        "502":
          $ref: "#/components/responses/SimpleError"
        "503":
          $ref: "#/components/responses/SimpleError"

  /api/terrain/heightmap/{level}/{x}/{y}:
    get:
      operationId: terrainHeightmap
      summary: The ground of one terrain tile, from the local DEMs
      description: |
        65 × 65 heights in metres above the WGS84 ellipsoid (the geoid separation added, as the LiDAR's
        is), little-endian Int16, rows from north to south and each row west to east: 8,450 bytes. The
        tiling is Cesium's geographic one: two tiles at level 0, each 180° wide, quartered at every
        level; tile `x` counts from 180° W, `y` from 90° N. A tile no DEM reaches answers 204: no data,
        never sea level. Levels above 22 are refused.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
        - { name: level, in: path, required: true, schema: { type: integer, minimum: 0, maximum: 22 } }
        - { name: x, in: path, required: true, schema: { type: integer, minimum: 0 } }
        - { name: y, in: path, required: true, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: The heights.
          headers:
            X-Terrain-Samples:
              schema: { type: string, example: "65" }
            Cache-Control:
              schema: { type: string, example: "private, max-age=604800" }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "204":
          description: No DEM reaches this tile.
        "400":
          $ref: "#/components/responses/SimpleError"

  /api/terrain/heights:
    post:
      operationId: terrainHeights
      summary: Ground and geoid at points, for placing a route in 3D
      description: |
        For each point in the order sent: `groundM`, the ground in metres above the ellipsoid from the
        same DEMs and correction as the heightmap tiles (null where no DEM covers it, never made up),
        and `geoidM`, the geoid separation there, which turns an MSL height into one above the
        ellipsoid (`mslFt × 0.3048 + geoidM`). Not `/api/elevations`, which feeds the route planner and
        the AMPS export. At most 5,000 points. Never cached: it says where someone means to fly.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [points]
              properties:
                points:
                  type: array
                  items:
                    type: object
                    required: [lat, lon]
                    properties:
                      lat: { type: number }
                      lon: { type: number }
      responses:
        "200":
          description: Heights, one of each for every point.
          content:
            application/json:
              schema:
                type: object
                required: [groundM, geoidM]
                properties:
                  groundM:
                    type: array
                    items: { type: number, nullable: true }
                  geoidM:
                    type: array
                    items: { type: number }
        "400":
          $ref: "#/components/responses/SimpleError"
        "503":
          $ref: "#/components/responses/SimpleError"

  # -- Mission packs (docs/MISSION_PACKS.md) ---------------------------------------------
  # Every pack route needs the `mission_packs` entitlement (403 `feature_disabled` without it)
  # and is never cached. A pack the caller is not in is a 404, so its existence is not revealed.

  /api/packs:
    get:
      operationId: listPacks
      summary: The packs the caller is in, directly or through a team, most recently changed first
      security:
        - bearer: []
      responses:
        "200":
          description: Summaries.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [packs]
                properties:
                  packs:
                    type: array
                    items: { $ref: "#/components/schemas/PackSummary" }
    post:
      operationId: createPack
      summary: Make a pack; the caller owns it
      description: |
        Send `uuid`, one the device chose, so a retry after a lost response returns the
        first pack (200) instead of making a second (201). `team_id` shares it with a team
        the caller is in, whose members then see it as `team_role`.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100, description: "Trimmed; no control characters." }
                description: { type: string, maxLength: 2000 }
                uuid: { type: string }
                team_id: { type: integer }
                team_role: { type: string, enum: [editor, viewer] }
      responses:
        "201":
          description: Made.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pack" }
        "200":
          description: The caller already made a pack with this `uuid`; here it is.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pack" }
        "400":
          $ref: "#/components/responses/PackError"
        "409":
          $ref: "#/components/responses/PackError"

  /api/packs/{uuid}:
    parameters:
      - $ref: "#/components/parameters/PackUuid"
    get:
      operationId: getPack
      summary: The pack with its members and every item, as of `head_seq`
      description: |
        A consistent view: the items are exactly as after event `head_seq`. To stay current,
        replay `GET /api/packs/{uuid}/events?since=<head_seq>` (or the live stream) from here.
      security:
        - bearer: []
      responses:
        "200":
          description: The pack.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pack" }
        "404":
          $ref: "#/components/responses/PackError"
    put:
      operationId: updatePack
      summary: Rename or describe the pack (editors), or share it with a team (owner)
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                description: { type: string, maxLength: 2000 }
                team_id: { type: integer, nullable: true, description: "null stops sharing." }
                team_role: { type: string, enum: [editor, viewer] }
      responses:
        "200":
          description: The pack after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pack" }
        "400":
          $ref: "#/components/responses/PackError"
        "403":
          $ref: "#/components/responses/PackError"
        "404":
          $ref: "#/components/responses/PackError"
        "423":
          $ref: "#/components/responses/PackError"
    delete:
      operationId: deletePack
      summary: Delete the pack and everything in it (owner)
      security:
        - bearer: []
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "403":
          $ref: "#/components/responses/PackError"
        "404":
          $ref: "#/components/responses/PackError"

  /api/packs/{uuid}/access:
    parameters:
      - $ref: "#/components/parameters/PackUuid"
    get:
      operationId: packAccess
      summary: Whether the caller may see the pack, and as whom
      description: What the live service asks, with the person's own token, before it opens a socket and whenever the pack's membership changes. An app has no need of it.
      security:
        - bearer: []
      responses:
        "200":
          description: The caller's place in the pack.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [role, status, head_seq, user]
                properties:
                  role: { type: string, enum: [owner, editor, viewer] }
                  status: { type: string, enum: [active, finished] }
                  head_seq: { type: integer, minimum: 0 }
                  user:
                    type: object
                    additionalProperties: false
                    required: [id, name]
                    properties:
                      id: { type: integer }
                      name: { type: string }
        "404":
          $ref: "#/components/responses/PackError"

  /api/packs/{uuid}/finish:
    parameters:
      - $ref: "#/components/parameters/PackUuid"
    post:
      operationId: finishPack
      summary: Finish the pack (owner). Every edit is then refused with 423, the owner's included
      security:
        - bearer: []
      responses:
        "200":
          description: The pack, finished. Finishing a finished pack changes nothing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pack" }
        "403":
          $ref: "#/components/responses/PackError"
        "404":
          $ref: "#/components/responses/PackError"

  /api/packs/{uuid}/reopen:
    parameters:
      - $ref: "#/components/parameters/PackUuid"
    post:
      operationId: reopenPack
      summary: Reopen a finished pack (owner)
      security:
        - bearer: []
      responses:
        "200":
          description: The pack, active.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pack" }
        "403":
          $ref: "#/components/responses/PackError"
        "404":
          $ref: "#/components/responses/PackError"

  /api/packs/{uuid}/duplicate:
    parameters:
      - $ref: "#/components/parameters/PackUuid"
    post:
      operationId: duplicatePack
      summary: A new pack owned by the caller, with a copy of every item (works on a finished pack)
      security:
        - bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100, description: 'Default: "<name> (copy)".' }
      responses:
        "201":
          description: The new pack.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pack" }
        "400":
          $ref: "#/components/responses/PackError"
        "404":
          $ref: "#/components/responses/PackError"

  /api/packs/{uuid}/ops:
    parameters:
      - $ref: "#/components/parameters/PackUuid"
    post:
      operationId: applyPackOps
      summary: Apply a batch of edits, in order, each numbered and logged
      description: |
        Each operation is applied, or logged as `skipped` when what it edits is gone or in the
        way; the rules are `contracts/fixtures/packs/ops.json` (and `ops-brief.json`). Each carries a `client_op_id`
        (printable ASCII, 64 at most): one the pack has seen is answered from the log and not
        applied again, so a batch whose answer was lost is safe to send again. A malformed
        operation refuses the whole batch (400 `invalid_op`, with `index` and `reason`) before
        anything is applied. `item.replace` is the server's own and is refused.

        With `base_seq`, `events` is everything after it (up to 500; `has_more` says there is
        more), so the client can rebase its unconfirmed edits; without it, just this batch's.
        Viewers get 403 `pack_read_only`; a finished pack 423 `pack_finished`; an item that
        would pass 5 MB 413 `item_too_large`. The exception is a batch whose every operation is
        on a `brief` item (one stored as a brief, or made as one earlier in the batch): briefing
        is open to every member, viewers included, in every state of the pack. A batch with any
        other operation in it is refused whole, so send brief edits in batches of their own.

        Those three refusals always carry `taken` (a server from before it sent none: read that
        as none): the operations of this batch the pack's log already has, the caller's own, in
        log order, each as its result in a 200 would be; empty when there are none. A batch
        whose answer was lost and that is refused when it is sent again (the pack finished, the
        caller made a viewer, or the batch grew by an edit that is too large) may have been
        taken the first time: what `taken` lists is the pack's and is not to be offered back
        as the person's own; the rest of the batch was not taken. A 400 carries no `taken`: it
        is decided from the operations alone, before the pack is looked at, and a batch the
        pack took is well formed when it is sent again as it was. Someone not in the pack gets
        a bare 404.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ops]
              properties:
                base_seq: { type: integer, minimum: 0 }
                ops:
                  type: array
                  description: 1 to 200 operations.
                  items:
                    type: object
                    required: [type, item, client_op_id]
                    properties:
                      type: { type: string, enum: [item.create, item.delete, item.rename, set, patch, upsert, insert, remove] }
                      item: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,63}$' }
                      client_op_id: { type: string, maxLength: 64 }
                      summary: { type: string, description: "The log's sentence for it, e.g. \"Colin moved Chalk 2 on LZ Hawk\". Cut to 300." }
      responses:
        "200":
          description: How each went.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackOpsResult" }
        "400":
          $ref: "#/components/responses/PackError"
        "403":
          $ref: "#/components/responses/PackError"
        "404":
          $ref: "#/components/responses/PackError"
        "413":
          $ref: "#/components/responses/PackError"
        "423":
          $ref: "#/components/responses/PackError"

  /api/packs/{uuid}/events:
    parameters:
      - $ref: "#/components/parameters/PackUuid"
    get:
      operationId: packEvents
      summary: The pack's log after a cursor, oldest first
      description: What a client replays to catch up (keep `cursor`, send it back as `since`), and the History panel's lines.
      security:
        - bearer: []
      parameters:
        - name: since
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          description: Page size, 1 to 500. A larger request is clamped.
          schema: { type: integer, minimum: 1, default: 200 }
      responses:
        "200":
          description: A page of events.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackEventPage" }
        "400":
          $ref: "#/components/responses/PackError"
        "404":
          $ref: "#/components/responses/PackError"

  /api/packs/{uuid}/seen:
    parameters:
      - $ref: "#/components/parameters/PackUuid"
    put:
      operationId: markPackSeen
      summary: How far the caller has looked in the pack
      description: |
        The newest event the caller has seen. It never goes back (an older value changes nothing) and is
        clamped to `head_seq`. What "changed since you looked" is measured from on every device the person
        uses (`seen_seq` in the pack), and what a member's "Seen" time is (`seen_at`). Any member, viewers and
        finished packs included. Not part of the log.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seq]
              properties:
                seq: { type: integer, minimum: 0 }
      responses:
        "200":
          description: The caller's marker as it now is.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [seen_seq, seen_at]
                properties:
                  seen_seq: { type: integer, minimum: 0 }
                  seen_at: { type: string }
        "400":
          $ref: "#/components/responses/PackError"
        "404":
          $ref: "#/components/responses/PackError"

  /api/packs/{uuid}/items:
    parameters:
      - $ref: "#/components/parameters/PackUuid"
    post:
      operationId: copyIntoPack
      summary: Copy one of the caller's library records into the pack
      description: |
        The copy is the pack's; the original is never changed by it. The item remembers its
        `source` so whoever copied it in can later update it from the original. Sketched routes
        only: an imported AMPS mission (`kind: mission`) is refused with `mission_not_supported`.
        Send `item` (the new item's uuid) so a retry returns the first copy (200).
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source:
                  type: object
                  required: [kind]
                  description: The library record, by `id` or by `client_uuid`.
                  properties:
                    kind: { type: string, enum: [lz, route, pointset] }
                    id: { type: integer }
                    client_uuid: { type: string }
                item: { type: string }
                name: { type: string, maxLength: 100 }
                summary: { type: string }
      responses:
        "201":
          description: Copied in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackItemReply" }
        "200":
          description: This copy was already made under this `item`; here it is (`event` is null).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackItemReply" }
        "400":
          $ref: "#/components/responses/PackError"
        "403":
          $ref: "#/components/responses/PackError"
        "404":
          $ref: "#/components/responses/PackError"
        "409":
          $ref: "#/components/responses/PackError"
        "413":
          $ref: "#/components/responses/PackError"
        "423":
          $ref: "#/components/responses/PackError"

  /api/packs/{uuid}/items/{item}:
    parameters:
      - $ref: "#/components/parameters/PackUuid"
      - $ref: "#/components/parameters/PackItemUuid"
    get:
      operationId: getPackItem
      summary: One item, whole
      security:
        - bearer: []
      responses:
        "200":
          description: The item.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [item, head_seq]
                properties:
                  item: { $ref: "#/components/schemas/PackItem" }
                  head_seq: { type: integer, minimum: 0 }
        "404":
          $ref: "#/components/responses/PackError"

  /api/packs/{uuid}/items/{item}/update-from-original:
    parameters:
      - $ref: "#/components/parameters/PackUuid"
      - $ref: "#/components/parameters/PackItemUuid"
    post:
      operationId: updatePackItemFromOriginal
      summary: Replace a copied item's content with its library original as it is now
      description: |
        Only the member who copied it in may (`not_your_original` otherwise): the original is
        their private record. Logged as an `item.replace` event carrying the new content.
        `original_gone` (409) when the original has been deleted; `original_unknown` (409) for a
        copy whose `source.uuid` is null, which cannot say which record it came from.
      security:
        - bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                summary: { type: string }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackItemReply" }
        "403":
          $ref: "#/components/responses/PackError"
        "404":
          $ref: "#/components/responses/PackError"
        "409":
          $ref: "#/components/responses/PackError"
        "413":
          $ref: "#/components/responses/PackError"
        "423":
          $ref: "#/components/responses/PackError"

  /api/packs/{uuid}/items/{item}/library:
    parameters:
      - $ref: "#/components/parameters/PackUuid"
      - $ref: "#/components/parameters/PackItemUuid"
    post:
      operationId: savePackItemToLibrary
      summary: Save a copy of an item to the caller's own library (any member; works on a finished pack)
      description: Needs the `cloud_save` entitlement too. The new record syncs like any other.
      security:
        - bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
      responses:
        "201":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryCopy" }
        "400":
          $ref: "#/components/responses/PackError"
        "403":
          $ref: "#/components/responses/PackError"
        "404":
          $ref: "#/components/responses/PackError"

  /api/packs/{uuid}/members:
    parameters:
      - $ref: "#/components/parameters/PackUuid"
    post:
      operationId: addPackMember
      summary: Add someone who shares a team with the owner (owner). Anyone else is invited by email
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: integer }
                role: { type: string, enum: [editor, viewer], default: editor }
      responses:
        "201":
          description: Added; they are emailed a notice.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackMemberReply" }
        "400":
          $ref: "#/components/responses/PackError"
        "403":
          $ref: "#/components/responses/PackError"
        "404":
          $ref: "#/components/responses/PackError"
        "409":
          $ref: "#/components/responses/PackError"

  /api/packs/{uuid}/members/{user_id}:
    parameters:
      - $ref: "#/components/parameters/PackUuid"
      - $ref: "#/components/parameters/UserId"
    put:
      operationId: changePackMember
      summary: Change a member's role (owner). `owner` hands the pack over; the old owner stays an editor
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [owner, editor, viewer] }
