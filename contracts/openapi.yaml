      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
      responses:
        "200":
          description: The team.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400":
          $ref: "#/components/responses/PackError"
        "403":
          $ref: "#/components/responses/PackError"
        "404":
          $ref: "#/components/responses/PackError"
    delete:
