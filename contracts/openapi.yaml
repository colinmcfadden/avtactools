openapi: 3.0.3
info:
  title: EZ/PZ API (the parts the native apps call)
  version: 1.2.0
  description: |
    The contract between the Flask API and the web and native clients. It holds
    the routes the apps call, one at a time as each arrives; a route missing from
    here is not yet something an app may rely on. `backend/tests/test_openapi_contract.py`
    fails when a response stops matching, so a server change that would break an
    installed app shows up as a test failure first.

    `version` above is the **API version**, apart from the product's and each app's.
    Its major is the promise to installed apps, which stay in the field for months:
    within one major nothing they read or send stops working. Additive changes (a
    new route, an optional field) bump the minor. A breaking one (a field removed,
    retyped or made nullable, a new required input, an enum widened in a response)
    bumps the major: `contracts/scripts/api_version.py check` compares this file with
    the branch it merges into and fails until it does, and `bump` writes the version
    the change calls for. `backend/api_version.py` must agree, and lists the majors
    the server still serves; `/api/config` sends them, and each client build lists
    the majors it supports (`ezpz.apiMajors` in `android/gradle.properties`,
    `frontend/src/apiSupport.json`).

    Every route is under `/api`. The base URL is the deployment's (the same host
    the web app uses); it is not part of the spec.
servers:
  - url: https://prod-ezpz-api.mcfadd.in
    description: Self-hosted production (Coolify behind Cloudflare Tunnel)
  - url: http://127.0.0.1:5000
    description: Local development

paths:
  /api/config:
    get:
      operationId: getConfig
      summary: What an app needs before anyone signs in
      description: |
        Public: no token. The same answer for everyone, cached for a minute. Apps
        read it at launch (never on the startup path to a usable map) and again on
        resume, to learn whether an update is required, whether there is a
        maintenance notice, which optional services are up, and which Mapbox public
        token to use, so the token can rotate without an app release.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: The configuration.
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=60
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"

  /api/auth/login:
    post:
      operationId: login
      summary: Sign in with email and password
      description: |
        A native app (`X-EZPZ-Client` platform `android` or `ios`) also receives a
        `refresh_token`, which keeps it signed in while the account is active and the
        device is used at least once in 30 days. The web, when it sends
        `X-EZPZ-Session: cookie`, receives its refresh token only as an HttpOnly cookie
        (`ezpz_refresh`, under `/api/auth`), never in the body.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
        - $ref: "#/components/parameters/SessionHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /api/auth/google:
    post:
      operationId: googleSignIn
      summary: Sign in with a Google ID token
      description: |
        The token's audience must be one of the server's `GOOGLE_CLIENT_IDS` (the
        web, Android and iOS clients each have their own). Refresh tokens are given
        as for `/api/auth/login`.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
        - $ref: "#/components/parameters/SessionHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Error"

  /api/auth/register:
    post:
      operationId: register
      summary: Start an account with a name and an email address
      description: |
        Registration is email-first: no password is chosen until the address is verified, so an
        existing address cannot be told apart from a new one (the answer is the same, 202). The
        emailed link opens `?auth=verify&token=...` on the site, which the app takes as a deep link.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name: { type: string, maxLength: 120 }
                email: { type: string }
      responses:
        "202":
          description: Accepted. If the address could be used, a verification link was emailed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accepted"
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /api/auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Confirm an address and set the password, with the token from the emailed link
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Verified. The account can sign in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Done"
        "400":
          $ref: "#/components/responses/Error"

  /api/auth/resend-verification:
    post:
      operationId: resendVerification
      summary: Email the verification link again
      description: Always 202, whether or not the address has a pending account. At most one link a minute, and three an hour.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accepted"
        "429":
          $ref: "#/components/responses/Error"

  /api/auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Email a password reset link
      description: Always 202, whether or not the address has an account.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accepted"
        "429":
          $ref: "#/components/responses/Error"

  /api/auth/reset-password:
    post:
      operationId: resetPassword
      summary: Set a new password with the token from the emailed link
      description: Ends every other session of the account (the session version is bumped).
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Done"
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /api/auth/mil/request:
    post:
      operationId: milRequest
      summary: Email a code to a .mil address, to clear the affiliation gate
      description: |
        Any `.mil` address clears the gate. The code lives 30 minutes. A `.mil` address clears one
        account only (409 if it is already verified elsewhere). This route and `/mil/verify` are
        reachable by a signed-in account that has not cleared the gate.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        "202":
          description: A code was emailed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Done"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /api/auth/mil/verify:
    post:
      operationId: milVerify
      summary: Confirm the emailed code
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: Cleared. `user.access_ok` is now true.
          content:
            application/json:
              schema:
                type: object
                required: [status, user]
                properties:
                  status: { type: string, enum: [success] }
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /api/auth/refresh:
    post:
      operationId: refresh
      summary: Swap a refresh token for a new access token and the next refresh token
      description: |
        The refresh token is spent: use the new one. If a response is lost, repeating
        the same request within 30 seconds is safe and is answered again. After that, a
        spent token coming back signs the device out (`refresh_reuse_detected`): it
        looks like a copy. A password reset, a suspension or deletion of the account,
        a sign-out from another device, and 30 days without a refresh all end the
        session; the answer is 401 (403 `account_unavailable` for a suspension) and the
        app must ask the user to sign in. There is no other limit: a session in use has
        no end. (A server before API 1.2 also ended one 180 days after sign-in,
        `refresh_expired`.)

        A native app sends `refresh_token` in the body and is answered with the next
        one. The web sends no body token but `X-EZPZ-Session: cookie` and its
        `ezpz_refresh` cookie, and is answered with a 15-minute access token and the
        next refresh token as the cookie. Without the header the cookie is not read, which
        is what keeps a page on another site from spending it. A token is refreshed only
        the way it was issued. With the header and no cookie the answer is 401
        `refresh_cookie_missing`: this browser does not keep the cookie.
      parameters:
        - $ref: "#/components/parameters/SessionHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string, description: A native app's token. The web sends none. }
      responses:
        "200":
          description: A new access token and the next refresh token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /api/auth/logout:
    post:
      operationId: logout
      summary: End this device's session
      description: A web session's `ezpz_refresh` cookie, when it is sent, is cleared too.
      security:
        - bearer: []
      responses:
        "200":
          description: Signed out. The access token stops working at once.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, enum: [success] }

  /api/auth/sessions:
    get:
      operationId: listSessions
      summary: The user's signed-in devices
      security:
        - bearer: []
      responses:
        "200":
          description: Devices that are still signed in.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"

  /api/auth/sessions/{id}:
    delete:
      operationId: revokeSession
      summary: Sign one of the user's devices out
      description: Its access token stops working at once. 404 for a session that is not the caller's.
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Signed out.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, enum: [success] }
        "404":
          $ref: "#/components/responses/Error"

  /api/auth/me:
    get:
      operationId: me
      summary: The signed-in user
      security:
        - bearer: []
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteAccount
      summary: Delete the account and everything saved under it
      description: |
        Required by the app stores. Irreversible. The body must carry `confirm: "DELETE"`
        and proof of ownership now: the `password`, or for a Google-only account a fresh
        Google ID token as `google_token`. A token alone is not proof. The super-admin
        account cannot be deleted (403 `super_admin_protected`).
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string, enum: [DELETE] }
                password: { type: string }
                google_token: { type: string }
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, message]
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /api/sync/changes:
    get:
      operationId: syncChanges
      summary: Everything of the caller's that changed after a cursor, deletions included
      description: |
        How a device catches up. Send `since=0` the first time; keep the returned
        `cursor` and send it back as `since` next time. While `has_more` is true, ask
        again at once. The order is a per-user counter, not a timestamp, so a change
        is never skipped and none is returned twice, even for edits that race.

        A deleted record arrives as a tombstone (`deleted: true`, empty `data`); the
        identity (`client_uuid`) survives so the device knows which local record to
        remove. Never cached.
      security:
        - bearer: []
      parameters:
        - name: since
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          description: Page size, 1 to 500. A larger request is clamped.
          schema: { type: integer, minimum: 1, default: 100 }
      responses:
        "200":
          description: A page of changes, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeFeed"
        "400":
          $ref: "#/components/responses/SimpleError"

  /api/lz:
    get:
      operationId: listLzs
      summary: The caller's saved LZs (summaries, without deleted ones)
      security:
        - bearer: []
      responses:
        "200":
          description: Summaries, newest edit first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LzSummary"
    post:
      operationId: createLz
      summary: Save an LZ
      description: |
        Send `client_uuid`, a UUID the device chose, so a retry after a lost response
        returns the first record (200) instead of making a second (201).
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, lz_data]
              properties:
                name: { type: string }
                lz_data: { description: "The diagram document (schema 2).", type: object }
                client_uuid: { type: string }
      responses:
        "201":
          description: Created.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LzSummary"
        "200":
          description: A record with this `client_uuid` already existed; here it is.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LzSummary"
        "400":
          $ref: "#/components/responses/SimpleError"

  /api/lz/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: getLz
      summary: One saved LZ, with its diagram
      security:
        - bearer: []
      responses:
        "200":
          description: The record.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LzFull"
        "404":
          $ref: "#/components/responses/SimpleError"
    put:
      operationId: updateLz
      summary: Edit a saved LZ
      description: |
        Send `If-Match: "<revision>"` with the revision the edit was based on. If the
        server has moved on, nothing is overwritten and the server's copy comes back
        with 409 (`revision_conflict`): keep the local one beside it for the user to
        resolve. Without `If-Match` the last writer wins, as the web app always has.
        A retry carrying the same `Idempotency-Key` is recognised and answered, not
        refused as a conflict with itself.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                lz_data: { type: object }
      responses:
        "200":
          description: Saved (or recognised as a retry).
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LzSummary"
        "400":
          $ref: "#/components/responses/SimpleError"
        "404":
          $ref: "#/components/responses/SimpleError"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteLz
      summary: Delete a saved LZ
      description: |
        Leaves a tombstone, with the content gone, so devices learn of the deletion
        through `/api/sync/changes`. Deleting twice is not an error. A stale
        `If-Match` is a 409 and deletes nothing.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [deleted] }
                  revision: { type: integer }
        "404":
          $ref: "#/components/responses/SimpleError"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/routes:
    get:
      operationId: listRoutes
      summary: The caller's saved routes (summaries, without deleted ones)
      security:
        - bearer: []
      responses:
        "200":
          description: Summaries, newest edit first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RouteSummary"
    post:
      operationId: createRoute
      summary: Save a set of sketched routes
      description: |
        `multipart/form-data`, as the web sends it: `name`, `route_data` (a JSON document, as text) and
        `kind` (`sketch`, the default). A `mission` save also needs the `msnx` file part, which the apps
        do not send yet. Send `client_uuid`, a UUID the device chose, so a retry after a lost response
        returns the first record (200) instead of making a second (201).
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, route_data]
              properties:
                name: { type: string }
                kind: { type: string, enum: [sketch, mission] }
                route_data: { type: string, description: "A JSON document: `{ version: 1, routes: [...] }`, the sketched routes (see contracts/fixtures/routes)." }
                client_uuid: { type: string }
                msnx: { type: string, format: binary, description: "Mission saves only." }
      responses:
        "201":
          description: Created.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteSummary"
        "200":
          description: A record with this `client_uuid` already existed; here it is.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteSummary"
        "400":
          $ref: "#/components/responses/SimpleError"

  /api/routes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: getRoute
      summary: One saved route set, with its routes
      security:
        - bearer: []
      responses:
        "200":
          description: The record.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteFull"
        "404":
          $ref: "#/components/responses/SimpleError"
    put:
      operationId: updateRoute
      summary: Edit a saved route set
      description: |
        `multipart/form-data` with the same fields as a create; only what is sent is changed, and the kind is
        fixed at creation. Send `If-Match: "<revision>"` with the revision the edit was based on: if the server
        has moved on, nothing is overwritten and the server's copy comes back with 409 (`revision_conflict`).
        Without `If-Match` the last writer wins, as the web app always has.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name: { type: string }
                route_data: { type: string }
                msnx: { type: string, format: binary }
      responses:
        "200":
          description: Saved (or recognised as a retry).
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteSummary"
        "400":
          $ref: "#/components/responses/SimpleError"
        "404":
          $ref: "#/components/responses/SimpleError"
        "409":
          $ref: "#/components/responses/RouteConflict"
    delete:
      operationId: deleteRoute
      summary: Delete a saved route set
      description: |
        Leaves a tombstone, with the content (and the mission file) gone, so devices learn of the deletion
        through `/api/sync/changes`. Deleting twice is not an error. A stale `If-Match` is a 409 and deletes nothing.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [deleted] }
                  revision: { type: integer }
        "404":
          $ref: "#/components/responses/SimpleError"
        "409":
          $ref: "#/components/responses/RouteConflict"

  /api/pointsets:
    get:
      operationId: listPointSets
      summary: The caller's saved local point sets (summaries, without deleted ones)
      security:
        - bearer: []
      responses:
        "200":
          description: Summaries, newest edit first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PointSetSummary"
    post:
      operationId: createPointSet
      summary: Save a set of local points
      description: |
        A set has at least one point. Send `client_uuid`, a UUID the device chose, so a retry after a lost
        response returns the first record (200) instead of making a second (201). The colour and whether a
        set is shown on the map are not saved: each device keeps its own.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, points]
              properties:
                name: { type: string }
                points: { $ref: "#/components/schemas/PointList" }
                client_uuid: { type: string }
      responses:
        "201":
          description: Created.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointSetSummary"
        "200":
          description: A record with this `client_uuid` already existed; here it is.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointSetSummary"
        "400":
          $ref: "#/components/responses/SimpleError"

  /api/pointsets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: getPointSet
      summary: One saved point set, with its points
      security:
        - bearer: []
      responses:
        "200":
          description: The record.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointSetFull"
        "404":
          $ref: "#/components/responses/SimpleError"
    put:
      operationId: updatePointSet
      summary: Edit a saved point set
      description: |
        Only what is sent is changed (a name or points that are empty are ignored). Send `If-Match: "<revision>"`
        with the revision the edit was based on: if the server has moved on, nothing is overwritten and the
        server's copy comes back with 409 (`revision_conflict`). Without `If-Match` the last writer wins, as the
        web app always has.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                points: { $ref: "#/components/schemas/PointList" }
      responses:
        "200":
          description: Saved (or recognised as a retry).
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointSetSummary"
        "404":
          $ref: "#/components/responses/SimpleError"
        "409":
          $ref: "#/components/responses/PointSetConflict"
    delete:
      operationId: deletePointSet
      summary: Delete a saved point set
      description: |
        Leaves a tombstone, with the points gone, so devices learn of the deletion through
        `/api/sync/changes`. Deleting twice is not an error. A stale `If-Match` is a 409 and deletes nothing.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [deleted] }
                  revision: { type: integer }
        "404":
          $ref: "#/components/responses/SimpleError"
        "409":
          $ref: "#/components/responses/PointSetConflict"

  /api/briefs:
    get:
      operationId: listBriefs
      summary: The caller's saved mission briefs (summaries, without deleted ones)
      description: |
        A brief kept in the Library, outside a mission pack (docs/MISSION_BRIEF.md §3). Every `/api/briefs` route needs
        the `mission_brief` entitlement and answers 403 `feature_disabled` without it; a create or an edit needs
        `cloud_save` too.
      security:
        - bearer: []
      responses:
        "200":
          description: Summaries, newest edit first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BriefSummary"
    post:
      operationId: createBrief
      summary: Save a mission brief
      description: |
        As `POST /api/lz`: send `client_uuid`, a UUID the device chose, so a retry after a lost response returns the
        first record (200) instead of making a second (201). `data` is the brief document; the server does not look
        inside it.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, data]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                data: { description: "The brief document (docs/MISSION_BRIEF.md §2.2).", type: object }
                client_uuid: { type: string }
      responses:
        "201":
          description: Created.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BriefSummary"
        "200":
          description: A record with this `client_uuid` already existed; here it is.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BriefSummary"
        "400":
          $ref: "#/components/responses/SimpleError"

  /api/briefs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: getBrief
      summary: One saved mission brief, with its document
      security:
        - bearer: []
      responses:
        "200":
          description: The record.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BriefFull"
        "404":
          $ref: "#/components/responses/SimpleError"
    put:
      operationId: updateBrief
      summary: Edit a saved mission brief
      description: |
        As `PUT /api/lz/{id}`: send `If-Match: "<revision>"`; a server that has moved on overwrites nothing and answers
        409 with its copy. Without `If-Match` the last writer wins. A retry with the same `Idempotency-Key` is answered,
        not refused. Only what is sent changes.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
