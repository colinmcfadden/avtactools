name: Android

# Runs only for changes the Android app depends on. Nothing here deploys: app
# builds reach users only when the owner uploads a signed build to a store
# (docs/NATIVE_APPS_PLAN.md, "Signing and delivery").
on:
  push:
    branches: [develop]
    paths:
      - "android/**"
      - "contracts/**"
      - "backend/**"
      - ".github/workflows/android.yaml"
  pull_request:
    paths:
      - "android/**"
      - "contracts/**"
      - "backend/**"
      - ".github/workflows/android.yaml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin-tests:
    name: Kotlin and Android tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      # The modules compile to JDK 17 (android/build-logic), but the tests run on 21: Robolectric's sandbox for
      # Android SDK 36 refuses an older Java ("Android SDK 36 requires Java 21").
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # The API client is also tried against the real Flask routes (backend/tests/live_server.py), so a
      # client and the server it will meet cannot drift apart. Those tests run when EZPZ_LIVE_PYTHON points
      # at a Python that has the server's packages, and are skipped without it.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install what the live test server imports
        working-directory: .
        run: |
          for p in Flask flask-cors Flask-JWT-Extended Flask-SQLAlchemy SQLAlchemy google-auth PyJWT requests \
                   python-dotenv PyYAML openpyxl pillow rasterio numpy mercantile affine; do
            grep -i "^$p==" backend/requirements.txt
          done | xargs pip install

      # GitHub's Ubuntu image has the Android SDK but not necessarily the newest platform: compose 1.12 needs
      # compileSdk 37 (android/build-logic).
      - name: Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      # The pure-Kotlin modules (core-model, core-geo, core-planning, ...) held to the golden fixtures in
      # contracts/, and the Android modules' unit tests, which run on the JVM against Robolectric.
      - name: Test
        run: ./gradlew test --console=plain
        env:
          EZPZ_LIVE_PYTHON: python

      # Lint is held to zero warnings (warningsAsErrors in the convention plugins), and the app has to assemble.
      - name: Lint and assemble
        run: ./gradlew lintDebug assembleDebug --console=plain
