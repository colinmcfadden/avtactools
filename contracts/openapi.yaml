        "403":
          $ref: "#/components/responses/PackError"
        "404":
          $ref: "#/components/responses/PackError"
        "409":
          $ref: "#/components/responses/PackError"
    delete:
      operationId: removeTeamMember
      summary: Leave (yourself), or remove someone (owner; an admin removes members only)
      security:
        - bearer: []
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "403":
          $ref: "#/components/responses/PackError"
        "404":
          $ref: "#/components/responses/PackError"
        "409":
          $ref: "#/components/responses/PackError"

  /api/teams/{id}/invites:
    parameters:
      - $ref: "#/components/parameters/TeamId"
    get:
      operationId: listTeamInvites
      summary: Invitations not yet answered (owner or admin)
      security:
        - bearer: []
      responses:
        "200":
          description: Invitations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteList" }
        "403":
          $ref: "#/components/responses/PackError"
        "404":
          $ref: "#/components/responses/PackError"
    post:
      operationId: inviteToTeam
