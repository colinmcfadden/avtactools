<?xml version="1.0" encoding="UTF-8"?>
<!--
  UH-60 Black Hawk, top view, nose up, drawn to scale: the original EZ/PZ helicopter, redrawn at the aircraft's
  published dimensions. 1 unit = 1 decimetre; the main rotor's mast is at (0, 0), so the picture turns about it.
  UH-60L/M: main rotor 16.36 m across (53 ft 8 in, radius 81.8); fuselage 15.26 m long (50 ft 0.75 in), nose 5.25 m
  ahead of the mast, and 2.36 m wide (7 ft 9 in); stabilator 4.38 m span (14 ft 4.5 in), at the foot of the tail pylon 9.5 m behind the mast; tail rotor 3.35 m across
  (11 ft) with its hub 9.905 m behind the mast, so 19.76 m overall with the rotors turning (64 ft 10 in), which is
  where the loop at the tail ends. Strokes are centred on the true outlines. #64F338 is replaced to draw other states.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-115.8 -115.8 231.6 231.6">
  <!-- main rotor disc: green on a black edge, so it reads on any base map -->
  <circle cx="0" cy="0" r="81.8" fill="none" stroke="#000000" stroke-width="14"/>
  <circle cx="0" cy="0" r="81.8" fill="none" stroke="#64F338" stroke-width="10"/>
  <!-- fuselage -->
  <path d="M 0 -52.5 C 7.5 -52.5, 11.8 -46, 11.8 -38 L 11.8 18 L 5 38 L 3 92 C 3 97.5, 1.8 100.1, 0 100.1
           C -1.8 100.1, -3 97.5, -3 92 L -5 38 L -11.8 18 L -11.8 -38 C -11.8 -46, -7.5 -52.5, 0 -52.5 Z"
        fill="#000000" stroke="#64F338" stroke-width="4" stroke-linejoin="round"/>
  <!-- stabilator -->
  <rect x="-21.9" y="91.5" width="43.8" height="7" rx="3.5" fill="#64F338" stroke="#000000" stroke-width="2"/>
  <!-- tail rotor, drawn as the original drew it: a loop at the tail, ending where the turning tail rotor ends -->
  <path d="M -4.2 106.5 C -4.2 112, -2.3 115.8, 0 115.8 C 2.3 115.8, 4.2 112, 4.2 106.5 C 4.2 102.6, 2.4 100.6, 0 100.6
           C -2.4 100.6, -4.2 102.6, -4.2 106.5 Z" fill="none" stroke="#000000" stroke-width="5"/>
  <path d="M -4.2 106.5 C -4.2 112, -2.3 115.8, 0 115.8 C 2.3 115.8, 4.2 112, 4.2 106.5 C 4.2 102.6, 2.4 100.6, 0 100.6
           C -2.4 100.6, -4.2 102.6, -4.2 106.5 Z" fill="none" stroke="#64F338" stroke-width="2.5"/>
  <!-- the four main rotor blades over everything, then the hub -->
  <path d="M -57.84 -57.84 L 57.84 57.84 M 57.84 -57.84 L -57.84 57.84" stroke="#000000" stroke-width="12" stroke-linecap="round"/>
  <path d="M -57.84 -57.84 L 57.84 57.84 M 57.84 -57.84 L -57.84 57.84" stroke="#64F338" stroke-width="8" stroke-linecap="round"/>
  <circle cx="0" cy="0" r="5" fill="#64F338" stroke="#000000" stroke-width="2"/>
</svg>
