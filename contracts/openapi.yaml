openapi: 3.0.3
info:
  title: EZ/PZ API (the parts the native apps call)
  version: 0.1.0
  description: |
    The contract between the Flask API and the web and native clients. It holds
    the routes the apps call, one at a time as each arrives; a route missing from
    here is not yet something an app may rely on. `backend/tests/test_openapi_contract.py`
    fails when a response stops matching, so a server change that would break an
    installed app shows up as a test failure first.

    Store builds stay in the field for months. Changes here are additive: a new
    optional field, a new route. Removing or retyping a field breaks apps that
    cannot be updated, and needs `configVersion` bumped and `minAppVersion` raised.

    Every route is under `/api`. The base URL is the deployment's (the same host
    the web app uses); it is not part of the spec.
servers:
  - url: https://prod-ezpz-api.mcfadd.in
    description: Self-hosted production (Coolify behind Cloudflare Tunnel)
  - url: http://127.0.0.1:5000
    description: Local development

paths:
  /api/config:
    get:
      operationId: getConfig
      summary: What an app needs before anyone signs in
      description: |
        Public: no token. The same answer for everyone, cached for a minute. Apps
        read it at launch (never on the startup path to a usable map) and again on
        resume, to learn whether an update is required, whether there is a
        maintenance notice, which optional services are up, and which Mapbox public
        token to use, so the token can rotate without an app release.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      responses:
        "200":
          description: The configuration.
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=60
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"

  /api/auth/login:
    post:
      operationId: login
      summary: Sign in with email and password
      description: |
        A native app (`X-EZPZ-Client` platform `android` or `ios`) also receives a
        `refresh_token`, which keeps it signed in for days with no signal. The web
        app does not: its exposure is unchanged.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /api/auth/google:
    post:
      operationId: googleSignIn
      summary: Sign in with a Google ID token
      description: |
        The token's audience must be one of the server's `GOOGLE_CLIENT_IDS` (the
        web, Android and iOS clients each have their own).
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Error"

  /api/auth/register:
    post:
      operationId: register
      summary: Start an account with a name and an email address
      description: |
        Registration is email-first: no password is chosen until the address is verified, so an
        existing address cannot be told apart from a new one (the answer is the same, 202). The
        emailed link opens `?auth=verify&token=...` on the site, which the app takes as a deep link.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name: { type: string, maxLength: 120 }
                email: { type: string }
      responses:
        "202":
          description: Accepted. If the address could be used, a verification link was emailed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accepted"
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /api/auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Confirm an address and set the password, with the token from the emailed link
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Verified. The account can sign in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Done"
        "400":
          $ref: "#/components/responses/Error"

  /api/auth/resend-verification:
    post:
      operationId: resendVerification
      summary: Email the verification link again
      description: Always 202, whether or not the address has a pending account. At most one link a minute, and three an hour.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accepted"
        "429":
          $ref: "#/components/responses/Error"

  /api/auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Email a password reset link
      description: Always 202, whether or not the address has an account.
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accepted"
        "429":
          $ref: "#/components/responses/Error"

  /api/auth/reset-password:
    post:
      operationId: resetPassword
      summary: Set a new password with the token from the emailed link
      description: Ends every other session of the account (the session version is bumped).
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Done"
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /api/auth/mil/request:
    post:
      operationId: milRequest
      summary: Email a code to a .mil address, to clear the affiliation gate
      description: |
        Any `.mil` address clears the gate. The code lives 30 minutes. A `.mil` address clears one
        account only (409 if it is already verified elsewhere). This route and `/mil/verify` are
        reachable by a signed-in account that has not cleared the gate.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        "202":
          description: A code was emailed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Done"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /api/auth/mil/verify:
    post:
      operationId: milVerify
      summary: Confirm the emailed code
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: Cleared. `user.access_ok` is now true.
          content:
            application/json:
              schema:
                type: object
                required: [status, user]
                properties:
                  status: { type: string, enum: [success] }
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /api/auth/refresh:
    post:
      operationId: refresh
      summary: Swap a refresh token for a new access token and the next refresh token
      description: |
        The refresh token is spent: use the new one. If a response is lost, repeating
        the same request within 30 seconds is safe and is answered again. After that, a
        spent token coming back signs the device out (`refresh_reuse_detected`): it
        looks like a copy. A password reset, a suspension, a sign-out from another
        device, and 180 days since sign-in all end the session; the answer is 401 and
        the app must ask the user to sign in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: A new access token and the next refresh token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /api/auth/logout:
    post:
      operationId: logout
      summary: End this device's session
      security:
        - bearer: []
      responses:
        "200":
          description: Signed out. The access token stops working at once.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, enum: [success] }

  /api/auth/sessions:
    get:
      operationId: listSessions
      summary: The user's signed-in devices
      security:
        - bearer: []
      responses:
        "200":
          description: Devices that are still signed in.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"

  /api/auth/sessions/{id}:
    delete:
      operationId: revokeSession
      summary: Sign one of the user's devices out
      description: Its access token stops working at once. 404 for a session that is not the caller's.
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Signed out.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, enum: [success] }
        "404":
          $ref: "#/components/responses/Error"

  /api/auth/me:
    get:
      operationId: me
      summary: The signed-in user
      security:
        - bearer: []
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteAccount
      summary: Delete the account and everything saved under it
      description: |
        Required by the app stores. Irreversible. The body must carry `confirm: "DELETE"`
        and proof of ownership now: the `password`, or for a Google-only account a fresh
        Google ID token as `google_token`. A token alone is not proof. The super-admin
        account cannot be deleted (403 `super_admin_protected`).
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string, enum: [DELETE] }
                password: { type: string }
                google_token: { type: string }
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, message]
                properties:
                  status: { type: string, enum: [success] }
                  message: { type: string }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /api/sync/changes:
    get:
      operationId: syncChanges
      summary: Everything of the caller's that changed after a cursor, deletions included
      description: |
        How a device catches up. Send `since=0` the first time; keep the returned
        `cursor` and send it back as `since` next time. While `has_more` is true, ask
        again at once. The order is a per-user counter, not a timestamp, so a change
        is never skipped and none is returned twice, even for edits that race.

        A deleted record arrives as a tombstone (`deleted: true`, empty `data`); the
        identity (`client_uuid`) survives so the device knows which local record to
        remove. Never cached.
      security:
        - bearer: []
      parameters:
        - name: since
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          description: Page size, 1 to 500. A larger request is clamped.
          schema: { type: integer, minimum: 1, default: 100 }
      responses:
        "200":
          description: A page of changes, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeFeed"
        "400":
          $ref: "#/components/responses/SimpleError"

  /api/lz:
    get:
      operationId: listLzs
      summary: The caller's saved LZs (summaries, without deleted ones)
      security:
        - bearer: []
      responses:
        "200":
          description: Summaries, newest edit first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LzSummary"
    post:
      operationId: createLz
      summary: Save an LZ
      description: |
        Send `client_uuid`, a UUID the device chose, so a retry after a lost response
        returns the first record (200) instead of making a second (201).
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, lz_data]
              properties:
                name: { type: string }
                lz_data: { description: "The diagram document (schema 2).", type: object }
                client_uuid: { type: string }
      responses:
        "201":
          description: Created.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LzSummary"
        "200":
          description: A record with this `client_uuid` already existed; here it is.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LzSummary"
        "400":
          $ref: "#/components/responses/SimpleError"

  /api/lz/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: getLz
      summary: One saved LZ, with its diagram
      security:
        - bearer: []
      responses:
        "200":
          description: The record.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LzFull"
        "404":
          $ref: "#/components/responses/SimpleError"
    put:
      operationId: updateLz
      summary: Edit a saved LZ
      description: |
        Send `If-Match: "<revision>"` with the revision the edit was based on. If the
        server has moved on, nothing is overwritten and the server's copy comes back
        with 409 (`revision_conflict`): keep the local one beside it for the user to
        resolve. Without `If-Match` the last writer wins, as the web app always has.
        A retry carrying the same `Idempotency-Key` is recognised and answered, not
        refused as a conflict with itself.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                lz_data: { type: object }
      responses:
        "200":
          description: Saved (or recognised as a retry).
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LzSummary"
        "400":
          $ref: "#/components/responses/SimpleError"
        "404":
          $ref: "#/components/responses/SimpleError"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteLz
      summary: Delete a saved LZ
      description: |
        Leaves a tombstone, with the content gone, so devices learn of the deletion
        through `/api/sync/changes`. Deleting twice is not an error. A stale
        `If-Match` is a 409 and deletes nothing.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [deleted] }
                  revision: { type: integer }
        "404":
          $ref: "#/components/responses/SimpleError"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/routes:
    get:
      operationId: listRoutes
      summary: The caller's saved routes (summaries, without deleted ones)
      security:
        - bearer: []
      responses:
        "200":
          description: Summaries, newest edit first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RouteSummary"
    post:
      operationId: createRoute
      summary: Save a set of sketched routes
      description: |
        `multipart/form-data`, as the web sends it: `name`, `route_data` (a JSON document, as text) and
        `kind` (`sketch`, the default). A `mission` save also needs the `msnx` file part, which the apps
        do not send yet. Send `client_uuid`, a UUID the device chose, so a retry after a lost response
        returns the first record (200) instead of making a second (201).
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, route_data]
              properties:
                name: { type: string }
                kind: { type: string, enum: [sketch, mission] }
                route_data: { type: string, description: "A JSON document: `{ version: 1, routes: [...] }`, the sketched routes (see contracts/fixtures/routes)." }
                client_uuid: { type: string }
                msnx: { type: string, format: binary, description: "Mission saves only." }
      responses:
        "201":
          description: Created.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteSummary"
        "200":
          description: A record with this `client_uuid` already existed; here it is.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteSummary"
        "400":
          $ref: "#/components/responses/SimpleError"

  /api/routes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: getRoute
      summary: One saved route set, with its routes
      security:
        - bearer: []
      responses:
        "200":
          description: The record.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteFull"
        "404":
          $ref: "#/components/responses/SimpleError"
    put:
      operationId: updateRoute
      summary: Edit a saved route set
      description: |
        `multipart/form-data` with the same fields as a create; only what is sent is changed, and the kind is
        fixed at creation. Send `If-Match: "<revision>"` with the revision the edit was based on: if the server
        has moved on, nothing is overwritten and the server's copy comes back with 409 (`revision_conflict`).
        Without `If-Match` the last writer wins, as the web app always has.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name: { type: string }
                route_data: { type: string }
                msnx: { type: string, format: binary }
      responses:
        "200":
          description: Saved (or recognised as a retry).
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteSummary"
        "400":
          $ref: "#/components/responses/SimpleError"
        "404":
          $ref: "#/components/responses/SimpleError"
        "409":
          $ref: "#/components/responses/RouteConflict"
    delete:
      operationId: deleteRoute
      summary: Delete a saved route set
      description: |
        Leaves a tombstone, with the content (and the mission file) gone, so devices learn of the deletion
        through `/api/sync/changes`. Deleting twice is not an error. A stale `If-Match` is a 409 and deletes nothing.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [deleted] }
                  revision: { type: integer }
        "404":
          $ref: "#/components/responses/SimpleError"
        "409":
          $ref: "#/components/responses/RouteConflict"

  /api/pointsets:
    get:
      operationId: listPointSets
      summary: The caller's saved local point sets (summaries, without deleted ones)
      security:
        - bearer: []
      responses:
        "200":
          description: Summaries, newest edit first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PointSetSummary"
    post:
      operationId: createPointSet
      summary: Save a set of local points
      description: |
        A set has at least one point. Send `client_uuid`, a UUID the device chose, so a retry after a lost
        response returns the first record (200) instead of making a second (201). The colour and whether a
        set is shown on the map are not saved: each device keeps its own.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, points]
              properties:
                name: { type: string }
                points: { $ref: "#/components/schemas/PointList" }
                client_uuid: { type: string }
      responses:
        "201":
          description: Created.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointSetSummary"
        "200":
          description: A record with this `client_uuid` already existed; here it is.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointSetSummary"
        "400":
          $ref: "#/components/responses/SimpleError"

  /api/pointsets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: getPointSet
      summary: One saved point set, with its points
      security:
        - bearer: []
      responses:
        "200":
          description: The record.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointSetFull"
        "404":
          $ref: "#/components/responses/SimpleError"
    put:
      operationId: updatePointSet
      summary: Edit a saved point set
      description: |
        Only what is sent is changed (a name or points that are empty are ignored). Send `If-Match: "<revision>"`
        with the revision the edit was based on: if the server has moved on, nothing is overwritten and the
        server's copy comes back with 409 (`revision_conflict`). Without `If-Match` the last writer wins, as the
        web app always has.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                points: { $ref: "#/components/schemas/PointList" }
      responses:
        "200":
          description: Saved (or recognised as a retry).
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointSetSummary"
        "404":
          $ref: "#/components/responses/SimpleError"
        "409":
          $ref: "#/components/responses/PointSetConflict"
    delete:
      operationId: deletePointSet
      summary: Delete a saved point set
      description: |
        Leaves a tombstone, with the points gone, so devices learn of the deletion through
        `/api/sync/changes`. Deleting twice is not an error. A stale `If-Match` is a 409 and deletes nothing.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [deleted] }
                  revision: { type: integer }
        "404":
          $ref: "#/components/responses/SimpleError"
        "409":
          $ref: "#/components/responses/PointSetConflict"

  /api/aircraft-profiles:
    get:
      operationId: listAircraftProfiles
      summary: The master aircraft list, then the caller's own profiles
      description: |
        Active master profiles (`is_system: true`, the admin's list) followed by the
        caller's own live profiles. Only the caller's own carry `client_uuid` and
        `revision`: the master list does not sync, so a device refetches it.
      security:
        - bearer: []
      responses:
        "200":
          description: Master profiles first, then the caller's.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AircraftProfile"
    post:
      operationId: createAircraftProfile
      summary: Make a custom aircraft profile
      description: |
        Needs the `aircraft_profiles` entitlement. Anything left out takes a default.
        Send `client_uuid` so a retry after a lost response returns the first profile
        (200) instead of making a second (201). `perf_source`, `is_active` and
        `sort_order` are the admin's and are ignored here.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AircraftProfileInput"
      responses:
        "201":
          description: Created.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AircraftProfile"
        "200":
          description: A profile with this `client_uuid` already existed; here it is.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AircraftProfile"
        "400":
          $ref: "#/components/responses/AircraftError"
        "403":
          $ref: "#/components/responses/SimpleError"

  /api/aircraft-profiles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    put:
      operationId: updateAircraftProfile
      summary: Edit one of the caller's own profiles
      description: |
        Only what is sent changes. `If-Match`, conflicts and `Idempotency-Key` work as
        they do for a saved LZ. A master profile, or another user's, is a 404.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AircraftProfileInput"
      responses:
        "200":
          description: Saved (or recognised as a retry).
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AircraftProfile"
        "400":
          $ref: "#/components/responses/AircraftError"
        "403":
          $ref: "#/components/responses/SimpleError"
        "404":
          $ref: "#/components/responses/SimpleError"
        "409":
          $ref: "#/components/responses/AircraftConflict"
    delete:
      operationId: deleteAircraftProfile
      summary: Delete one of the caller's own profiles
      description: |
        Leaves a tombstone, with the airframe's details and any AMPS bytes gone, so
        devices learn of the deletion through `/api/sync/changes`. Deleting twice is
        not an error. A stale `If-Match` is a 409 and deletes nothing.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [deleted] }
                  revision: { type: integer }
        "403":
          $ref: "#/components/responses/SimpleError"
        "404":
          $ref: "#/components/responses/SimpleError"
        "409":
          $ref: "#/components/responses/AircraftConflict"

  /api/analyze-field:
    post:
      operationId: analyzeField
      summary: Find the landing area around a target, and the ground elevation there
      description: |
        Runs the segmentation model on the satellite tile around `lat`/`lon` and returns the area
        it finds as a polygon (`suggested_lz`, `[lat, lon]` pairs), with the ground elevation in
        feet as a string (`"TBD"` when the elevation service could not be reached). One analysis
        runs at a time on the server, and it can take many seconds: an app shows progress and may
        stop waiting. A failure is `{status: "error", message}`, a shape of its own that this route
        has always had.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lon]
              properties:
                lat: { type: number }
                lon: { type: number }
      responses:
        "200":
          description: An area was found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldAnalysis"
        "400":
          $ref: "#/components/responses/FieldError"
        "500":
          $ref: "#/components/responses/FieldError"

  /api/terrain-analysis:
    post:
      operationId: terrainAnalysis
      summary: Slope over a landing-zone boundary
      description: |
        Slope from the best terrain source that covers the polygon, clipped to it: a transparent
        banded raster (`overlay`, a PNG data URI) placed at `bounds`, statistics over the polygon,
        and, when a `landingHeading` is given, the nose-high, nose-low and cross-slope summary for
        that heading against the UH-60 limits in `thresholds`. `directional` is null without a
        heading. Errors are `{error}`.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [polygon]
              properties:
                polygon:
                  type: array
                  description: At least three `[lat, lon]` pairs.
                  items:
                    type: array
                    items: { type: number }
                landingHeading:
                  type: number
                  nullable: true
                  description: Degrees true. Absent or null for no directional summary.
      responses:
        "200":
          description: The analysis.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerrainAnalysis"
        "400":
          $ref: "#/components/responses/SimpleError"
        "500":
          $ref: "#/components/responses/SimpleError"
        "502":
          $ref: "#/components/responses/SimpleError"

  /api/elevations:
    post:
      operationId: elevations
      summary: Ground elevation at each of a route's points
      description: |
        Samples the open Terrarium elevation tiles on the server, in whole feet, one answer for each point in
        the order sent. A point whose tile could not be read is `null`. A failure while sampling is
        still a 200 with `error` set and every elevation `null`, which an app treats the same as no
        answer: planning goes on without ground elevations. No points is an empty list.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [points]
              properties:
                points:
                  type: array
                  items:
                    type: object
                    required: [lat, lon]
                    properties:
                      lat: { type: number }
                      lon: { type: number }
      responses:
        "200":
          description: The elevations.
          content:
            application/json:
              schema:
                type: object
                required: [elevationsFt]
                properties:
                  elevationsFt:
                    type: array
                    items: { type: integer, nullable: true }
                  error:
                    type: string
                    description: Set when sampling failed; every elevation is then null.
        "400":
          $ref: "#/components/responses/SimpleError"

  /api/route-winds:
    post:
      operationId: routeWinds
      summary: Wind at each of a route's points, from the nearest weather station
      description: |
        For each point the nearest station is used. A point wanted more than about 30 minutes from now
        takes its wind from that station's forecast (`source: TAF`); any other point from the latest
        observation (`METAR`). A point with no station in reach is left out of `winds`. `time` is an ISO
        instant in UTC, or absent. `dirTrue` is where the wind blows FROM, 0 when it is variable (then
        `variable` is true).
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/ClientHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [points]
              properties:
                points:
                  type: array
                  items:
                    type: object
                    required: [id, lat, lon]
                    properties:
                      id: { type: string }
                      lat: { type: number }
                      lon: { type: number }
                      time: { type: string, nullable: true }
      responses:
        "200":
          description: The winds, by point id.
          content:
            application/json:
              schema:
                type: object
                required: [winds]
                properties:
                  winds:
                    type: object
                    additionalProperties:
                      $ref: "#/components/schemas/PointWind"
        "500":
          $ref: "#/components/responses/SimpleError"

components:
  parameters:
    ClientHeader:
      name: X-EZPZ-Client
      in: header
      required: false
      description: |
        Which app is calling: `platform/version (build)`, e.g. `android/1.4.0 (212)`.
        Sent by the native apps on every request. Recorded against sign-ins so the
        owner can see which versions are in the field. Anything that does not match
        this shape is ignored, never stored.
      schema:
        type: string
        maxLength: 64
        pattern: '^(android|ios|web)/\d{1,4}\.\d{1,4}\.\d{1,4}(-[0-9A-Za-z.]{1,20})?( \(\d{1,9}\))?$'

    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        The record's `revision` that this edit was based on, e.g. `"3"` (`*` matches
        any). A stale one is refused with 409 and nothing is overwritten.
      schema:
        type: string
        pattern: '^(\*|(W/)?"?\d{1,9}"?)$'

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        A key the device makes up for one write and repeats when it retries it. Printable
        ASCII, 64 characters at most; anything else is ignored. The write is applied once.
      schema:
        type: string
        maxLength: 64

  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The `access_token` from sign-in or refresh.

  headers:
    ETag:
      description: The record's current `revision`, quoted.
      schema: { type: string, example: '"3"' }

  responses:
    SimpleError:
      description: |
        An error from the saved-record and sync routes, which predate the auth routes'
        shape and keep theirs so the web app is undisturbed: `error` is for people, `code`
        (when present) is stable and meant for the app.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SimpleError"

    Error:
      description: An error. `code` is stable and meant for the app; `message` is for people.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    FieldError:
      description: |
        A failure of `/api/analyze-field`: `message` is for people. There is no `code`; an app tells
        "no area here" (400) from "the map data or the model failed" (500) by the status.
      content:
        application/json:
          schema:
            type: object
            required: [status, message]
            properties:
              status: { type: string, enum: [error] }
              message: { type: string }

    Conflict:
      description: |
        The record changed on the server since the revision the edit was based on.
        Nothing was overwritten; `server` is the current copy.
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
      content:
        application/json:
          schema:
            type: object
            required: [error, code, server]
            properties:
              error: { type: string }
              code: { type: string, enum: [revision_conflict] }
              server:
                $ref: "#/components/schemas/LzFull"

    RouteConflict:
      description: |
        The route set changed on the server since the revision the edit was based on.
        Nothing was overwritten; `server` is the current copy.
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
      content:
        application/json:
          schema:
            type: object
            required: [error, code, server]
            properties:
              error: { type: string }
              code: { type: string, enum: [revision_conflict] }
              server:
                $ref: "#/components/schemas/RouteFull"

    PointSetConflict:
      description: |
        The point set changed on the server since the revision the edit was based on.
        Nothing was overwritten; `server` is the current copy.
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
      content:
        application/json:
          schema:
            type: object
            required: [error, code, server]
            properties:
              error: { type: string }
              code: { type: string, enum: [revision_conflict] }
              server:
                $ref: "#/components/schemas/PointSetFull"

    AircraftConflict:
      description: |
        The profile changed on the server since the revision the edit was based on.
        Nothing was overwritten; `server` is the current copy.
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
      content:
        application/json:
          schema:
            type: object
            required: [error, code, server]
            properties:
              error: { type: string }
              code: { type: string, enum: [revision_conflict] }
              server:
                $ref: "#/components/schemas/AircraftProfile"

    AircraftError:
      description: Refused. `errors` lists every problem found; `error` is the first.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
              errors: { type: array, items: { type: string } }
              code: { type: string, enum: [invalid_client_uuid, invalid_if_match] }

  schemas:
    PointWind:
      type: object
      required: [dirTrue, speedKts, variable, station, source, distanceMiles]
      properties:
        dirTrue: { type: integer, description: Whole degrees true the wind blows from; 0 when variable. }
        speedKts: { type: number }
        variable: { type: boolean }
        tempC: { type: number, nullable: true, description: The nearest observation's temperature. }
        station: { type: string, nullable: true }
        source: { type: string, enum: [METAR, TAF] }
        distanceMiles: { type: number }

    SimpleError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code:
          type: string
          description: "`invalid_client_uuid`, `invalid_if_match`, `invalid_cursor`, `revision_conflict`"

    Error:
      type: object
      required: [status, message, error]
      properties:
        status: { type: string, enum: [error] }
        message: { type: string }
        error: { type: string }
        code:
          type: string
          description: |
            Stable codes include `invalid_credentials`, `invalid_refresh_token`,
            `refresh_reuse_detected`, `refresh_expired`, `account_unavailable`,
            `reauthentication_required`, `confirmation_required`, `session_not_found`,
            `super_admin_protected`, `rate_limited`, `affiliation_required`, `invalid_token`
            (an emailed link that is invalid, spent or expired), `invalid_code` (a `.mil` code).

    User:
      type: object
      required: [id, email, name, role, is_admin, is_active, features, access_ok]
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        picture: { type: string, nullable: true }
        email_verified: { type: boolean }
        account_status: { type: string }
        has_password: { type: boolean }
        role: { type: string }
        is_admin: { type: boolean }
        is_active: { type: boolean }
        features:
          type: object
          description: Entitlements. A missing key means enabled.
          additionalProperties: { type: boolean }
        mil_email: { type: string, nullable: true }
        affiliation_verified: { type: boolean }
        access_ok: { type: boolean, description: Whether the `.mil` / approval gate is cleared. }

    Done:
      type: object
      required: [status, message]
      properties:
        status: { type: string, enum: [success] }
        message: { type: string }

    Accepted:
      type: object
      required: [status, message]
      properties:
        status: { type: string, enum: [success] }
        message: { type: string }
        requires_verification: { type: boolean, description: Present on registration. }

    TokenResponse:
      type: object
      required: [status, access_token, user]
      properties:
        status: { type: string, enum: [success] }
        access_token: { type: string }
        refresh_token:
          type: string
          description: Native clients only. Spent on use; the response to `/refresh` carries the next one.
        refresh_expires_in:
          type: integer
          description: Seconds a refresh token lives (30 days); each refresh extends it, up to 180 days from sign-in.
        user:
          $ref: "#/components/schemas/User"

    Session:
      type: object
      additionalProperties: false
      required: [id, client, created_at, last_active_at, current]
      properties:
        id: { type: string }
        client: { type: string, nullable: true, description: "The app, e.g. `android/1.4.0 (212)`." }
        created_at: { type: string }
        last_active_at: { type: string }
        current: { type: boolean, description: This device. }

    LzSummary:
      type: object
      required: [id, name, created_at, updated_at, client_uuid, revision]
      properties:
        id: { type: integer }
        name: { type: string }
        created_at: { type: string }
        updated_at: { type: string }
        client_uuid: { type: string, description: "The record's identity: the device's own if it sent one." }
        revision: { type: integer, minimum: 1, description: Bumped by every change. }

    LzFull:
      type: object
      required: [id, name, created_at, updated_at, client_uuid, revision, lz_data]
      properties:
        id: { type: integer }
        name: { type: string }
        created_at: { type: string }
        updated_at: { type: string }
        client_uuid: { type: string }
        revision: { type: integer, minimum: 1 }
        lz_data: { type: object, description: "The diagram document, schema 2 (see contracts/fixtures/workspace)." }

    RouteSummary:
      type: object
      required: [id, name, kind, has_file, created_at, updated_at, client_uuid, revision]
      properties:
        id: { type: integer }
        name: { type: string }
        kind: { type: string, enum: [sketch, mission], description: "A sketch is routes drawn in the app; a mission also holds the AMPS file the web imported." }
        file_name: { type: string, nullable: true }
        has_file: { type: boolean }
        created_at: { type: string }
        updated_at: { type: string }
        client_uuid: { type: string }
        revision: { type: integer, minimum: 1 }

    RouteFull:
      type: object
      required: [id, name, kind, has_file, created_at, updated_at, client_uuid, revision, route_data]
      properties:
        id: { type: integer }
        name: { type: string }
        kind: { type: string, enum: [sketch, mission] }
        file_name: { type: string, nullable: true }
        has_file: { type: boolean }
        created_at: { type: string }
        updated_at: { type: string }
        client_uuid: { type: string }
        revision: { type: integer, minimum: 1 }
        route_data: { type: object, description: "A sketch's `{ version: 1, routes: [...] }`; a mission's is a display summary." }

    PointList:
      type: array
      minItems: 1
      description: |
        The points of a local point set as the web keeps them: `{ id, name, description, group, icon, elevationFt, lat, lon }`,
        read from an AMPS `.LPS` file. The server does not look inside.
      items: { type: object }

    PointSetSummary:
      type: object
      required: [id, name, point_count, created_at, updated_at, client_uuid, revision]
      properties:
        id: { type: integer }
        name: { type: string }
        point_count: { type: integer, minimum: 0 }
        created_at: { type: string }
        updated_at: { type: string }
        client_uuid: { type: string }
        revision: { type: integer, minimum: 1 }

    PointSetFull:
      type: object
      required: [id, name, point_count, created_at, updated_at, client_uuid, revision, points]
      properties:
        id: { type: integer }
        name: { type: string }
        point_count: { type: integer, minimum: 0 }
        created_at: { type: string }
        updated_at: { type: string }
        client_uuid: { type: string }
        revision: { type: integer, minimum: 1 }
        points: { type: array, items: { type: object } }

    AircraftProfile:
      type: object
      additionalProperties: false
      required:
        - id
        - slug
        - name
        - designation
        - icon_key
        - is_system
        - rotor_diameter_m
        - rotor_tip_clearance_m
        - default_airspeed_kts
        - default_airspeed_type
        - max_indicated_kts
        - default_altitude_ft
        - default_altitude_ref
        - min_altitude_ft_msl
        - max_altitude_ft_msl
        - default_fuel_flow_lb_hr
        - default_gross_weight_lb
        - perf_source
        - amps_vehicle_description
        - has_template
        - template_kind
        - template_name
        - sort_order
      description: |
        An airframe's footprint, planning defaults and AMPS binding. The AMPS bytes
        themselves are never in this shape (`has_template` says whether there are
        any); `GET /api/aircraft-profiles/{id}/template` returns them.
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        designation: { type: string }
        icon_key: { type: string }
        is_system: { type: boolean, description: True for the admin's master list. }
        rotor_diameter_m: { type: number }
        rotor_tip_clearance_m: { type: number }
        default_airspeed_kts: { type: number }
        default_airspeed_type: { type: string, enum: [ground, indicated, true] }
        max_indicated_kts: { type: number }
        default_altitude_ft: { type: number }
        default_altitude_ref: { type: string, enum: [agl, msl] }
        min_altitude_ft_msl: { type: number }
        max_altitude_ft_msl: { type: number }
        default_fuel_flow_lb_hr: { type: number }
        default_gross_weight_lb: { type: number }
        perf_source: { type: string, enum: [vidx, published, custom] }
        amps_vehicle_description: { type: string, nullable: true }
        has_template: { type: boolean }
        template_kind: { type: string, nullable: true, description: "`msnx` or `vidx`." }
        template_name: { type: string, nullable: true }
        sort_order: { type: integer }
        client_uuid: { type: string, description: "The profile's identity. The caller's own profiles only." }
        revision: { type: integer, minimum: 1, description: "Bumped by every change. The caller's own profiles only." }

    AircraftProfileInput:
      type: object
      description: |
        What a user may set. Anything else is ignored. Numbers are range-checked
        (rotor 1 to 60 m, speeds 1 to 400 kt, and so on); a minimum altitude above
        the maximum is refused.
      properties:
        client_uuid: { type: string, description: "On create only: a UUID the device chose." }
        name: { type: string, maxLength: 120 }
        designation: { type: string, maxLength: 40 }
        icon_key: { type: string, maxLength: 40 }
        rotor_diameter_m: { type: number }
        rotor_tip_clearance_m: { type: number }
        default_airspeed_kts: { type: number }
        default_airspeed_type: { type: string, enum: [ground, indicated, true] }
        max_indicated_kts: { type: number }
        default_altitude_ft: { type: number }
        default_altitude_ref: { type: string, enum: [agl, msl] }
        min_altitude_ft_msl: { type: number }
        max_altitude_ft_msl: { type: number }
        default_fuel_flow_lb_hr: { type: number }
        default_gross_weight_lb: { type: number }
        amps_vehicle_description: { type: string, maxLength: 200 }

    Change:
      type: object
      required: [type, id, client_uuid, revision, deleted, name, seq, data]
      description: |
        One changed record. `type` says which collection: `lz`, `route`, `pointset` or
        `aircraft` (the caller's own profiles; the master list does not sync).
        A tombstone has `deleted: true`, an empty `name` and empty `data`. A route also
        has `kind`, `file_name` and `has_file`; fetch the mission file separately.
      properties:
        type: { type: string, enum: [lz, route, pointset, aircraft] }
        id: { type: integer }
        client_uuid: { type: string }
        revision: { type: integer, minimum: 1 }
        deleted: { type: boolean }
        name: { type: string }
        created_at: { type: string, nullable: true }
        updated_at: { type: string, nullable: true }
        seq: { type: integer, minimum: 1, description: This change's place in the user's order. }
        kind: { type: string, description: "Routes only: `sketch` or `mission`." }
        file_name: { type: string, nullable: true }
        has_file: { type: boolean }
        data: { description: "lz_data, route_data, the points or the profile, per `type`." }

    ChangeFeed:
      type: object
      additionalProperties: false
      required: [cursor, has_more, changes]
      properties:
        cursor: { type: integer, minimum: 0, description: "Send this as `since` next time. Equals `since` when nothing changed." }
        has_more: { type: boolean, description: Ask again at once. }
        changes:
          type: array
          items:
            $ref: "#/components/schemas/Change"

    Config:
      type: object
      additionalProperties: false
      required: [configVersion, serverVersion, minAppVersion, maintenance, services, mapbox]
      properties:
        configVersion:
          type: integer
          minimum: 1
          description: Bumped when the shape changes in a way an old app cannot read.
        serverVersion:
          type: string
          description: The backend's semantic version.
        minAppVersion:
          type: object
          additionalProperties: false
          required: [android, ios]
          description: |
            The oldest app version the server still supports, per platform, as
            `X.Y.Z`; null means no minimum. An app below it shows "Update required".
          properties:
            android:
              type: string
              nullable: true
              pattern: '^\d{1,4}\.\d{1,4}\.\d{1,4}$'
            ios:
              type: string
              nullable: true
              pattern: '^\d{1,4}\.\d{1,4}\.\d{1,4}$'
        maintenance:
          type: object
          additionalProperties: false
          required: [active, message]
          properties:
            active:
              type: boolean
            message:
              type: string
              nullable: true
              maxLength: 500
        services:
          type: object
          additionalProperties: false
          required: [lidarBuilds, packs]
          description: Optional services, so the app can hide what is down instead of failing.
          properties:
            lidarBuilds:
              type: boolean
              description: The 3D point-cloud build service is configured.
            packs:
              type: boolean
              description: The mission-pack service is configured (not built yet).
        mapbox:
          type: object
          additionalProperties: false
          required: [publicToken]
          properties:
            publicToken:
              type: string
              nullable: true
              pattern: '^pk\.'
              description: A *public* Mapbox token only; a secret one is never served.

    FieldAnalysis:
      type: object
      required: [status, suggested_lz, elevation, message]
      properties:
        status: { type: string, enum: [success] }
        suggested_lz:
          type: array
          description: The polygon of the area found, `[lat, lon]` pairs.
          items:
            type: array
            items: { type: number }
        elevation:
          type: string
          description: Ground elevation in feet (SRTM 30 m), or `TBD` when it could not be had.
        message: { type: string }

    SlopeStats:
      type: object
      required: [maxDeg, p95Deg, areaOver6Pct, areaOver10Pct, areaOver15Pct, sampleCount, sampleAreaM2]
      properties:
        maxDeg: { type: number }
        p95Deg: { type: number }
        areaOver6Pct: { type: number }
        areaOver10Pct: { type: number }
        areaOver15Pct: { type: number }
        sampleCount: { type: integer }
        sampleAreaM2: { type: number }

    TerrainAnalysis:
      type: object
      required: [status, overlay, bounds, source, resolutionM, verticalDatum, stats, directional, thresholds]
      properties:
        status: { type: string, enum: [success] }
        overlay:
          type: string
          description: A `data:image/png;base64,` raster over `bounds`, banded by slope and transparent outside the polygon.
        bounds:
          type: array
          description: "`[[south, west], [north, east]]` of the raster."
          items:
            type: array
            items: { type: number }
        source:
          type: string
          description: Which terrain source answered, for example `local_highres_cog` or `terrarium`.
        resolutionM: { type: number }
        verticalDatum: { type: string }
        stats:
          $ref: "#/components/schemas/SlopeStats"
        directional:
          type: object
          nullable: true
          description: |
            Null when no landing heading was sent. Percentages are of the polygon's area that is over
            the UH-60 limit in `thresholds` for that direction.
          required: [headingDeg, noseHighMaxDeg, noseLowMaxDeg, crossSlopeMaxDeg, noseHighOverLimitPct, noseLowOverLimitPct, crossSlopeOverLimitPct]
          properties:
            headingDeg: { type: number }
            noseHighMaxDeg: { type: number }
            noseLowMaxDeg: { type: number }
            crossSlopeMaxDeg: { type: number }
            noseHighOverLimitPct: { type: number }
            noseLowOverLimitPct: { type: number }
            crossSlopeOverLimitPct: { type: number }
        thresholds:
          type: object
          required: [bands, uh60]
          properties:
            bands:
              type: array
              description: The slope band edges in degrees the raster is coloured by.
              items: { type: number }
            uh60:
              type: object
              required: [noseHigh, noseLow, crossSlope]
              description: The UH-60 landing limits in degrees.
              properties:
                noseHigh: { type: number }
                noseLow: { type: number }
                crossSlope: { type: number }
